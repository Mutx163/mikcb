plugins {
    id "com.android.application"
    id "kotlin-android"
    // 去 Flutter 化 P4-B（2026-11-07）：Flutter Gradle 插件已彻底移除，不再条件 apply。
    // Compose 编译器插件：自 2026-10-29 起 Compose 页面源码全部挂在 `main` 源集
    // （迁移期的 composeP1 / composeUi 两个 flavor 已删除），插件对所有变体生效。
    // 插件在 Kotlin 2.x 起接管 Compose 编译器（不再需要 composeOptions.kotlinCompilerExtensionVersion）。
    id "org.jetbrains.kotlin.plugin.compose"
}


// 版本号源（去 Flutter 化 P4）：`android/version.properties` 是唯一事实源，
// 与 pubspec 的 `version: <name>+<code>` 等价（见该文件头部注释）。
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionNameBase = versionProps.getProperty('versionName', '0.0.0')
def appVersionCodeBase = (versionProps.getProperty('versionCodeBase', '1')).toInteger()

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFile =
        keystoreProperties.getProperty("storeFile") ?: System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword =
        keystoreProperties.getProperty("storePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias =
        keystoreProperties.getProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword =
        keystoreProperties.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning =
        releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def overrideVersionName = project.findProperty("OVERRIDE_VERSION_NAME") ?: System.getenv("OVERRIDE_VERSION_NAME")

android {
    namespace = "com.mutx163.qingyu"
    compileSdk = 37
    ndkVersion = "28.2.13676358"

    buildFeatures {
        buildConfig = true
    }

    // JVM target 21（2026-10-28：接 miuix-nav 需要 Java21 字节码；Kotlin 与 Java 均 21，
    // Gradle 守护/工具链也是 JDK21，CI 同步 setup-java 21）。
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }


    defaultConfig {
        applicationId = "com.mutx163.qingyu"
        minSdk = 33
        targetSdk = 36
        // +100000 offset: Flutter 3.35+ 的 --split-per-abi 会在 versionCode 上加 ABI 乘数 (e.g., arm64: ×2000),
        // 移除 --split-per-abi 后 versionCode 会变小，导致 Android 误判为降级安装。
        // 加此偏移确保 versionCode 始终高于旧版分 ABI 构建的值。
        //
        // 去 Flutter 化 P4：版本号不再从 Flutter 插件（pubspec）读，改读
        // `android/version.properties`。原因：pubspec 即将删除，而 versionCode/versionName
        // 是发版必需项，不能跟着 Dart 层一起消失。
        // +100000 偏移保留（分 ABI 打包时代的 versionCode 可能更大，加偏移防降级误判）。
        versionCode = appVersionCodeBase + 100000
        versionName = overrideVersionName ?: appVersionNameBase
        buildConfigField "String", "UMENG_APP_KEY", "\"69c1fd8f9a7f3764889fba4f\""
        buildConfigField "String", "UMENG_CHANNEL", "\"official\""
        missingDimensionStrategy 'env', 'prod'
        // 仅保留 arm64: ML Kit AAR 自带三份 ABI 的 so(共 ~13MB),其中 x86_64/armeabi-v7a
        // 约 9MB 是纯冗余——minSdk 33 的真机全为 arm64。注意 defaultConfig 对 debug 同样
        // 生效,x86_64 模拟器将装不上本工程直出的任何 APK,真机/ARM 模拟器不受影响。
        // 必须用赋值整体替换:Flutter 插件 apply 时会 clear 后填入它支持的全部 ABI,
        // 方法调用写法(abiFilters 'arm64-v8a')只是往里追加,压不掉另两个。
        ndk {
            abiFilters = ['arm64-v8a']
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    // Product Flavors for different package names
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "UMENG_CHANNEL", "\"official-debug\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表调试版",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        perf {
            dimension "env"
            applicationIdSuffix ".profile"
            versionNameSuffix "-profile"
            buildConfigField "String", "UMENG_CHANNEL", "\"official-profile\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表性能版",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        prod {
            dimension "env"
            manifestPlaceholders = [
                    appLabel   : "轻屿课表",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        // 集成测试专用 flavor（2026-10-20 加）。
        //
        // 为什么单独一个包名：`flutter test integration_test/` 默认会在跑完后
        // **卸载**它安装的包（它自己的日志里有 `--[no-]uninstall`），而卸载会连
        // 私有数据一起清掉。用 dev flavor 跑测试等于占用 `.debug` 包 ——
        // 那是开发者日常调试用的包，跑一次测试就把那边的课表与设置清空一次。
        // 事故实例：2026-10-20 用 `-d <phone> --flavor dev` 跑冷启动测试，
        // `.debug` 包的数据随之丢失。
        //
        // 独立包名后：`.itest` 与 dev / profile / prod 三个包互不影响，
        // 跑多少次都不会碰到真实数据。
        itest {
            dimension "env"
            applicationIdSuffix ".itest"
            versionNameSuffix "-itest"
            buildConfigField "String", "UMENG_CHANNEL", "\"official-itest\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表集成测试",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
    }

    sourceSets {
        main {
            // 壳的 6 个文件（PagesShellActivity / ShellWiring / ShellRoute …）已于
            // 2026-10-29 从 `src/composeUi/kotlin` 搬进 `src/main/kotlin`，由 main 默认源集覆盖。
            //
            // Compose 页面整树挂载（2026-11-01）：此前这里逐目录登记了 23 条 srcDirs，
            // 漏登记一个目录，其下的页面就会**静默不编译**——不报错、不进 APK，只有运行到
            // 那一页时才崩。活例：包根的 `ComposeP1Activity.kt` 当时就没被挂上（已删，见下）。
            // 改为整树挂载后，新增 `pages/<域>` 子目录无需再改本文件；源码目录里的非 Kotlin
            // 文件（如 `WIRING-NOTE.md`）不会被 Kotlin 源集收录。
            kotlin.srcDirs += 'src/composeP1/kotlin'
        }

        // 迁移期那个 `testComposeUi` 变体专属测试源集随 composeUi 变体一并删除（2026-10-29）。
        // 页面源码自 2026-10-29 起全部住在 `main` 源集（原 `src/composeUi/kotlin` 已搬入），
        // 因此测它们的用例可以直接放共享的 `src/test/`，prod 变体的单测也会跑到。
    }


    buildTypes {
        debug {
            // Debug build type - no applicationIdSuffix here, handled by flavor
        }
        profile {
            initWith(getByName("debug"))
            matchingFallbacks = ['debug', 'release']
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 签名缺失不再于配置期抛错——配置期对所有 gradle 调用生效，会连带
            // CI 的 testProdDebugUnitTest 等纯 JVM 任务一起失败（CI 无
            // key.properties）。有签名则挂上；没有时改由文件尾 taskGraph
            // 校验，真正请求 release 打包任务时才报同样的错。
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
        // bench：**真正的性能包**（2026-10-29 加）。
        //
        // 为什么不是 profile：`profile` 是 `initWith(debug)`，debuggable=true ⇒ ART 跳过
        // AOT、R8 不跑，用它量的帧率/启动时间不代表正式版。bench 直接继承 release 的整档
        // 优化（R8 混淆 + 非 debuggable，minify 取 AGP 9 对 release 的默认值，不再单独覆盖，
        // 免得出现「测的档位和正式版不是一个档位」），同时保留最小的可观测性：
        //
        //   · `src/bench/AndroidManifest.xml` 的 `<profileable android:shell="true"/>`：
        //     不开 debuggable 也能被 Perfetto / simpleperf / `dumpsys gfxinfo` 采样；
        //   · `proguard-bench.pro` 保留行号与源文件名 ⇒ 崩溃栈与采样栈能对回源码；
        //   · **不加 applicationIdSuffix** ⇒ 与正式版同包名、同一份真实数据，
        //     能直接和正式版做 A/B（空数据的课表比满数据的课表快，测不出真问题）。
        //     ⚠️ 代价：装 bench 会覆盖手机上的正式版（应用数据保留，与升级一致）；
        //     想换回来就再装一次 release。这一条与 composeP1 当初覆盖安装验证同一路子。
        bench {
            initWith(getByName("release"))
            matchingFallbacks = ['release', 'debug']
            versionNameSuffix "-bench"
            // 只**追加**这一份规则（initWith 已带上 release 的那两条），不覆盖。
            proguardFiles 'proguard-bench.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // JVM 单测（:app:testProdDebugUnitTest）默认让 android.jar 的每个方法抛
    // "Method ... not mocked"。CourseWidgetAccent 的 relativeLuminance/rgbToHsl
    // 直接调用 android.graphics.Color.red/green/blue/argb —— 这几个是纯静态位
    // 运算重载，returnDefaultValues 下返回值与真机一致，测试才有意义。不开这个
    // 开关时 CourseWidgetAccentTest 的 8 例必然全红（实测 2026-09-10）。
    // 注意：只会让「未 mock 的 android 方法」返回默认值，不会掩盖被测逻辑本身的失败。
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// 变体白名单（2026-11-02）：4 个渠道 × 4 个构建类型 = 16 个组合，日常只用这 5 个。
// 未列出的组合在这里关掉，Android Studio 的 Build Variants 下拉框就只剩这 5 个。
//
// 关掉不只是「列表短」，更是堵住误选：
//   · devBench：包名是 .debug，但 bench 继承 release 签名 ⇒ 与日常调试包同包名不同签名，
//     装不上；Studio 在 Android 14+ 还会把真实错误盖成 INSTALL_BASELINE_PROFILE_FAILED。
//   · prodBench：与正式版完全同包名、同签名 ⇒ 一装就覆盖用户手机上的正式版。
//   · profile 档（devProfile / perfProfile / prodProfile / itestProfile）：测性能不作数
//     （AGENTS.md 规定只认 Bench 或 release），只在历史上用过。
//
// prodDebug 保留是给 CI 的 `:app:testProdDebugUnitTest` 用的，**不要拿它装机**：
// 它是 debug 签名 + 正式包名，会和已安装的正式版撞签名。
//
// 临时要用被关掉的组合：把变体名加进下面的列表即可，任务名会一起恢复。
// 注意 devProfile 关掉后 `flutter run --profile --flavor dev` 会找不到变体。
def keepVariants = ['devDebug', 'itestDebug', 'perfBench', 'prodDebug', 'prodRelease'] as Set

androidComponents {
    beforeVariants(selector().all()) { variant ->
        if (!keepVariants.contains(variant.name)) {
            variant.enable = false
        }
    }
}

// Compose 编译器插件是模块级应用的，对全部变体的 Kotlin 编译生效。2026-10-26 建这两个
// flavor 时，Compose runtime 只挂在 composeP1 的 classpath 上，其余变体编译时插件因找不到
// runtime 抛 IncompatibleComposeRuntimeVersionException，把整条 JVM 单测链连坐
//（2026-10-26 实测 :app:compileProdDebugKotlin 挂）。
//
// 2026-10-29 两个迁移期 flavor 已删、页面源码并入 main 后，miuix 的 `implementation` 已经
// 给所有变体带上了 compose runtime，下面这两条 compileOnly 理论上不再必要；**先保留**
// 作为兜底（不打包、不影响 APK 体积与运行时），等下一次专门验证依赖图时再删。
//
// KGP 2.2.20 没有公开的「按变体关闭编译器插件」开关（androidComponents 的
// ext 属性与 androidVariantsWithComposePlugin 均不存在，均已实测）。
// 采用社区成熟做法（stackoverflow.com/questions/69449113 的条件依赖形态，
// persian-calendar 项目同款）：把 Compose runtime 也挂到**其余变体**的
// compileOnly 上——插件能找到 runtime 即不报错，runtime 不进产物、不进
// 运行时 classpath，非 P1 变体的行为与加这条之前完全一致。
// 体积影响：compileOnly 不打包，APK 零变化（已用 aapt2 对比核对）。
dependencies {
    compileOnly "org.jetbrains.compose.runtime:runtime-android:1.12.0"
    // 单测源集同样会被 Compose 编译器插件扫到（testProdDebugUnitTestKotlin），
    // testImplementation 把 runtime 也递给测试 classpath（不进 APK）。
    testImplementation "org.jetbrains.compose.runtime:runtime-android:1.12.0"
}

// UmengCrashRedaction 靠反射改写 Throwable.detailMessage（java.lang 的私有
// 字段，java.base 模块不对未命名模块开放）：不加 --add-opens 时 JVM 单测里
// setAccessible(true) 抛 InaccessibleObjectException，脱敏写入静默回退、
// 测不到真实路径。Android（ART）没有模块系统，不受这条限制。
// i18n 棘轮门禁（CjkLiteralGateTest）与 *ParityTest 都在**运行时**去磁盘读基线文件、
// ARB 词条与渲染层源码。这类 I/O 对 Gradle 完全不可见：基线/ARB 不在任何 sourceSet
// 里，改它们不触发编译，任务被判 UP-TO-DATE 直接跳过。2026-10-27 A/B 实测：
// 把基线里 ComposeP1Activity.kt 的计数从 13 改成 12（门禁必然报错的值），
// :app:testProdDebugUnitTest 仍 UP-TO-DATE / BUILD SUCCESSFUL，结果 XML 时间戳
// 停在 11:40:17.479Z 未刷新 —— 门禁假绿。声明成 inputs 后再跑同一改动即 FAILED。
tasks.withType(Test).configureEach { test ->
    test.jvmArgs('--add-opens', 'java.base/java.lang=ALL-UNNAMED')
    // 基线 + ARB 是上面那条假绿的直接原因，必须声明。
    test.inputs.file(project.file('src/test/kotlin/com/mutx163/qingyu/i18n/cjk-literal-baseline.txt'))
            .withPropertyName('i18nCjkBaseline')
    test.inputs.file(project.file('../../i18n/app_zh.arb')).withPropertyName('i18nArbZh')
    // 渲染层源码本会经编译进入 inputs，但门禁读的是磁盘原文（含未参与编译的资源式
    // 片段），显式再声明一次：任一文件改动都强制重跑，代价只是一次测试。
    test.inputs.dir(project.file('src/composeP1/kotlin')).withPropertyName('i18nRenderSources')
}


// 去 Flutter 化 P4-B（2026-11-07）：`MainActivity.kt` / `FairMemoryFlutterBridge.kt` /
// `GeneratedPluginRegistrant.java` 已随 Dart 层一并删除，原先那两条 SourceTask/JavaCompile
// exclude（阶段 1 用作“无 Flutter 构型”开关）不再需要。


// Work around flutter/flutter#187553: merge*JniLibFolders may stay UP-TO-DATE while
// Flutter jniLibs changed, packaging a stale libapp.so into flavor APKs.
tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("JniLibFolders")) {
        task.outputs.upToDateWhen { false }
    }
}

// 无签名配置时，仅当任务图真的包含 release 打包任务（assemble/bundle 前缀
// + release 名）才报错；纯 JVM 测试/分析任务不被连坐。报错文案与原配置期
// 校验一致，指引不变。CNB/GitHub 发布流水线均注入真实签名，不受影响。
gradle.taskGraph.whenReady { graph ->
    if (hasReleaseSigning) {
        return
    }
    def needsSigning = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        (name.startsWith("assemble") || name.startsWith("bundle")) && name.contains("release")
    }
    if (needsSigning) {
        throw new GradleException(
                "Missing release signing config. Provide android/key.properties or ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
        )
    }
}

// AGP 9 内置 Kotlin（不再应用 kotlin-android 插件，`kotlinOptions` 也随之移除），
// 编译目标改由顶层 `kotlin { compilerOptions }` 指定。
kotlin {
    compilerOptions {
        // 21：miuix-nav 的 inline entry 是 Java21 字节码。注意根 android/build.gradle 的
        // subprojects 分支也把 :app 钉到 21（那里负责第三方子项目保持 17）；两处必须一致，
        // 否则只改一处会静默退回 17 并再次报 INLINE_FROM_HIGHER_PLATFORM。
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.umeng.umsdk:common:9.6.3'
    implementation 'com.umeng.umsdk:asms:1.8.0'
    // U-APM 1.5.2 → 2.1.0（2026-11-01，为 16KB 页对齐）：1.x 的
    // jni/arm64-v8a/libcrashsdk.so 是 4KB 页对齐（readelf -l 的 LOAD p_align=0x1000），
    // 在 16KB 页设备上加载失败，且 Google Play 自 2025-11-01 起要求 targetSdk 35+ 的
    // 更新必须支持 16KB。2.0.0 起换成 libucrash / libucrash-core / libumonitor，
    // 三者 p_align 均为 0x4000（llvm-strip 后仍是），arm64 体积 648KB → 403KB。
    // 应用侧只调 common 的 UMConfigure，不碰 apm 的 Java API，故仅换版本号。
    // 注意 2.x 的 AAR 清单多一个 :u_heap 进程的 UMonitorService（内存泄漏监控），
    // 不调用对应开关时不会启动。
    implementation 'com.umeng.umsdk:apm:2.1.0'
    implementation 'com.umeng.umsdk:uyumao:1.1.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    testImplementation 'junit:junit:4.13.2'

    // Compose 页面源码自 2026-10-29 起全部挂在 `main` 源集（composeP1 / composeUi 两个
    // 迁移期变体已删），所以下面这些依赖对**所有**变体生效。
    //
    // miuix 0.9.4（2026-10-27 用户拍板「按最新状态对齐，不顾一切」）：
    // 0.9.x 是模块化发布——miuix-ui（基础）/ miuix-preference（官方设置行）/
    // miuix-icons（图标）/ miuix-squircle / miuix-shader 各自独立。
    // 代价（已确认可承受）：其依赖的 Compose 1.12 硬要求 AGP 9.1+ 与 compileSdk 37，
    // 因此本工程同步抬到 AGP 9.4.1 + Gradle 9.8.2 + Kotlin 2.4.21 + compileSdk 37。
    // miuix-blur 是**独立 artifact**（包名 `top.yukonga.miuix.kmp.blur`），不在 miuix-ui 的
    // 传递依赖里（实测 0.9.4 的 miuix-ui POM 只带 core / squircle / compose-foundation）。
    // 玻璃材质的整套引擎都在这里：LayerBackdrop 抓下层、blur/colorControls/blendColors
    // 效果链、Highlight + BloomStroke 边缘扫光、TiltLight 倾斜光感。
    // 不引它，miuix-ui 的 NavigationBar 只能画纯色（`squircleBackground(color = surface)`）。
    def miuixVersion = '0.9.4'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "top.yukonga.miuix.kmp:miuix-ui-android:$miuixVersion"
    implementation "top.yukonga.miuix.kmp:miuix-preference-android:$miuixVersion"
    implementation "top.yukonga.miuix.kmp:miuix-icons-android:$miuixVersion"
    implementation "top.yukonga.miuix.kmp:miuix-blur-android:$miuixVersion"
    // miuix-nav：官方导航运行时（NavDisplay + 返回栈 + 转场），页面跳转动画只能用它（不自研）。
    // 与 miuix-ui 同版本 0.9.4。其产物是 Java21 字节码、entry DSL 是 inline，
    // 故 :app 的 Kotlin 目标必须是 21（见根 android/build.gradle 的 subprojects 特殊分支）。
    implementation "top.yukonga.miuix.kmp:miuix-nav-android:$miuixVersion"

    // 页面开发壳（PagesShellActivity）已搬进 main 源集，见上方依赖。

    // 相机扫码（Phase 3.5 · 能力缺口 B5，2026-10-28 Lead 拍板）。
    //
    // ## 为什么是 CameraX + MLKit，而不是更小的 ZXing
    //
    // 1. **与现产品对齐，不是新增体积**：老版 Flutter 的 `mobile_scanner` 在 Android 上
    //    用的就是 MLKit barcode-scanning，所以正式包**本来就带着这个模型**。
    //    换 ZXing 反而是一次「为了省体积而改变现网解码能力」的额外风险。
    // 2. **bundled 模型不依赖 Google Play 服务**：目标机型是国产 ROM（HyperOS / MIUI /
    //    OriginOS / HarmonyOS），`play-services-mlkit-*`（unbundled 版）在这些机器上
    //    要么要现场下载 ~15MB，要么直接不可用。bundled 版把模型打进 APK，离线可用。
    // 3. **解码鲁棒性**：用户是拿手机扫另一台手机上的二维码（可能斜、可能反光），
    //    MLKit 对模糊/角度的容忍度明显高于 ZXing 的 CPU 解码。
    // 4. **缓存已就绪**：`com.google.mlkit:barcode-scanning:17.3.0` 与 CameraX 的
    //    core/camera2/lifecycle 已在本地 Gradle 缓存里（只有 `camera-view` 需要拉一次）。
    //    多泳道并发时「少一次下载」就是少一次全队构建失败的可能。
    //
    // ⚠️ 实际挂载方式是 `implementation` ⇒ 对**所有变体**生效
    //    （dev / perf / prod / itest / bench），不是 compose 专属；迁移期的
    //    composeP1 变体已于 2026-10-29 删除。正式包也本来就带着这套模型：
    //    Flutter 侧 `mobile_scanner` 在 Android 上用的就是 MLKit barcode-scanning，
    //    所以这里不是给正式包额外新增一份体积。
    // ⚠️ 用到这些依赖的适配器代码放在 `composeP1/` 源树（如
    //    `pages/transfer/QrCameraHost.kt`），该源树由本文件的整树挂载并入 main 源集。
    def cameraxVersion = '1.6.1'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

}
