plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Compose 迁移（Phase 1）：composeP1 flavor 专属。插件在 Kotlin 2.x 起接管
    // Compose 编译器（不再需要 composeOptions.kotlinCompilerExtensionVersion）。
    id "org.jetbrains.kotlin.plugin.compose"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFile =
        keystoreProperties.getProperty("storeFile") ?: System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword =
        keystoreProperties.getProperty("storePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias =
        keystoreProperties.getProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword =
        keystoreProperties.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning =
        releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def overrideVersionName = project.findProperty("OVERRIDE_VERSION_NAME") ?: System.getenv("OVERRIDE_VERSION_NAME")

android {
    namespace = "com.mutx163.qingyu"
    compileSdk = 37
    ndkVersion = "28.2.13676358"

    buildFeatures {
        buildConfig = true
    }

    // JVM target 17（2026-10-27 随 miuix 0.9.4 从 1.8 抬升）：
    // 0.9.4 的产物按 Java 11 字节码编译，Kotlin 在 1.8 目标下无法内联其 inline 函数
    // （INLINE_FROM_HIGHER_PLATFORM）。AGP 9 + Gradle 9 本身也以 17 为基线。
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }


    defaultConfig {
        applicationId = "com.mutx163.qingyu"
        minSdk = 33
        targetSdk = 36
        // +100000 offset: Flutter 3.35+ 的 --split-per-abi 会在 versionCode 上加 ABI 乘数 (e.g., arm64: ×2000),
        // 移除 --split-per-abi 后 versionCode 会变小，导致 Android 误判为降级安装。
        // 加此偏移确保 versionCode 始终高于旧版分 ABI 构建的值。
        versionCode = (flutter.versionCode as int) + 100000
        versionName = overrideVersionName ?: flutter.versionName
        buildConfigField "String", "UMENG_APP_KEY", "\"69c1fd8f9a7f3764889fba4f\""
        buildConfigField "String", "UMENG_CHANNEL", "\"official\""
        missingDimensionStrategy 'env', 'prod'
        // 仅保留 arm64: ML Kit AAR 自带三份 ABI 的 so(共 ~13MB),其中 x86_64/armeabi-v7a
        // 约 9MB 是纯冗余——minSdk 33 的真机全为 arm64。注意 defaultConfig 对 debug 同样
        // 生效,x86_64 模拟器将装不上本工程直出的任何 APK,真机/ARM 模拟器不受影响。
        // 必须用赋值整体替换:Flutter 插件 apply 时会 clear 后填入它支持的全部 ABI,
        // 方法调用写法(abiFilters 'arm64-v8a')只是往里追加,压不掉另两个。
        ndk {
            abiFilters = ['arm64-v8a']
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    // Product Flavors for different package names
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "UMENG_CHANNEL", "\"official-debug\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表调试版",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        perf {
            dimension "env"
            applicationIdSuffix ".profile"
            versionNameSuffix "-profile"
            buildConfigField "String", "UMENG_CHANNEL", "\"official-profile\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表性能版",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        prod {
            dimension "env"
            manifestPlaceholders = [
                    appLabel   : "轻屿课表",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        // 集成测试专用 flavor（2026-10-20 加）。
        //
        // 为什么单独一个包名：`flutter test integration_test/` 默认会在跑完后
        // **卸载**它安装的包（它自己的日志里有 `--[no-]uninstall`），而卸载会连
        // 私有数据一起清掉。用 dev flavor 跑测试等于占用 `.debug` 包 ——
        // 那是开发者日常调试用的包，跑一次测试就把那边的课表与设置清空一次。
        // 事故实例：2026-10-20 用 `-d <phone> --flavor dev` 跑冷启动测试，
        // `.debug` 包的数据随之丢失。
        //
        // 独立包名后：`.itest` 与 dev / profile / prod 三个包互不影响，
        // 跑多少次都不会碰到真实数据。
        itest {
            dimension "env"
            applicationIdSuffix ".itest"
            versionNameSuffix "-itest"
            buildConfigField "String", "UMENG_CHANNEL", "\"official-itest\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表集成测试",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        // Compose 迁移 Phase 1 专用 flavor（2026-10-26 加）。
        //
        // 目的：在**同一个** android/app 工程里验证「同包名 Compose 壳」——
        // 真机覆盖安装后读同一份 FlutterSharedPreferences、桌面小组件 /
        // 无障碍 / 通知渠道全部原样保留（manifest 继承 main 源集）。
        // 验证完成后整个 flavor 连同源集一起删除，不进任何发布渠道。
        //
        // 不加 applicationIdSuffix：**必须**与 com.mutx163.qingyu 同包名，
        // 这是 Phase 1 的全部意义（数据原地、升级链路实证）。也因此它只能
        // 覆盖安装在「已装正式包」的真机上用于验证——调试日常仍用 dev。
        composeP1 {
            dimension "env"
            versionNameSuffix "-composeP1"
            // minSdk 33：官方 miuix-blur（毛玻璃）的硬性要求，用户已拍板抬到 33（2026-10-26）。
            // prod 已统一 33，此处保留显式声明以防 defaultConfig 回退。
            minSdk 33
            buildConfigField "String", "UMENG_CHANNEL", "\"official-composeP1\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表 Compose P1",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
        // Compose 迁移 Phase 3 页面开发壳（2026-10-26 加）。
        //
        // 为什么需要它：miuix 只挂在 composeP1 的 classpath 上，而 composeP1
        // **故意用正式包名**（Phase 1 要验证覆盖安装不丢数据）。到了 Phase 3
        // 做页面，继续借正式包名就意味着「看一眼新页面要先覆盖用户手机上的正式版」，
        // 这没有道理。所以另开一个**带后缀**的壳：
        // - 与正式版 / 调试版并存，互不影响；
        // - 静态页不需要老数据，正好适合独立包名（读不到正式版数据是预期行为）；
        // - composeP1 保持原样，它的历史使命（覆盖安装验证）已经完成。
        //
        // 页面代码复用 composeP1 源集（见下方 sourceSets），不复制一份。
        composeUi {
            dimension "env"
            applicationIdSuffix ".ui"
            versionNameSuffix "-composeUi"
            minSdk 33
            buildConfigField "String", "UMENG_CHANNEL", "\"official-composeUi\""
            manifestPlaceholders = [
                    appLabel   : "轻屿课表 Compose UI",
                    umengScheme: "um.69c1fd8f9a7f3764889fba4f"
            ]
        }
    }

    sourceSets {
        // 页面壳的渲染层**逐目录挂载**（2026-10-27 收口）。
        //
        // `src/composeP1/kotlin/…/pages/` 是 Phase 3 渲染层的暂存区：多会话并行时
        // 里面永远有半成品，把它整个挂进任何一个变体都会让「编译」这件事失去意义。
        // 所以这里按**目录**挂载：挂上 = 该批渲染层开始受 L1 与 CI 保护。
        // 行由 Lead 在该批交付/验收时追加，不要改成挂整个 pages/。
        composeUi {
            // 跨页共享件（台账 §6 指定的落点）：页面主题桥 QingyuPageTheme 在这里。
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/components'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/about'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/task'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/schedule'
            // P3-G3 导出与传输（export-transfer 泳道，2026-10-27 12:09 挂载）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/export'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/transfer'
            // P3-H 诊断与测试夹具（diagnostics 泳道，2026-10-27 12:24 挂载）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/diagnostics'
            // P3-F 同步与备份（sync-backup 泳道，2026-10-27 12:31 挂载）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/sync'
            // P3-D3 作息与考试（timescheme-exam 泳道，2026-10-27 12:36 挂载）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/exam'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/time_scheme'
            // P3-B 设置族（Lead 接管，2026-10-27 12:20 挂载）：渲染层是通用的
            // `SettingsPageScreen(spec)`，一目录服务全 20 页。4 个智能体正在这里
            // 并行写模型层（main 源集），只改本目录的渲染基础设施时才需要重验 L1。
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/settings'
            // P3-E 统计族（stats-renderer 泳道，2026-10-27 12:40 挂载）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/statistics'
            // P3-D1 课程表单与概览（lead 泳道，2026-10-27 14:28 挂载）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/course'
            // P3-G1 导入·基础（lead 泳道并入 P3-D1，同刻挂载；import/warehouse 归 P3-G2 泳道另行挂载）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/import'
            // 六批已交付但漏挂的渲染层收口（conflict/feedback/guide/showcase/live/weather；
            // 8514b433 会话按台账 §7.2 代 Lead 追加，2026-10-27 15:2x，L1 通过记录见门日志）
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/conflict'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/feedback'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/guide'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/showcase'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/live'
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/weather'
            // 课表族：周视图 P3-C1（367f3aed，12:05 交付）+ 日视图 P3-C3（b5b8bba2，11:xx 交付）。
            // 挂父目录会连 `timetable/day/` 一起带进来（子目录不需要单独一行）。
            // 2026-10-27 18:30 补挂：这两批交付时都漏了这一步，导致 3,920 行渲染层
            // 从交付起没有被任何变体编译过，壳里也一直停在占位页。
            kotlin.srcDirs += 'src/composeP1/kotlin/com/mutx163/qingyu/pages/timetable'
        }
    }

    // composeP1 迁移期**停役**（台账 §7.2）：它扫整棵暂存区 pages/，红是设计使然。
    // 给它的所有 Kotlin 编译任务挂快速失败——误点旧配置时给一行清楚的提示，
    // 而不是 60+ 条暂存区噪音报错。Phase 3 收尾删除该 flavor 时一并移除本段。
    tasks.matching {
        it.name.startsWith('compileComposeP1') && it.name.endsWith('Kotlin')
    }.configureEach {
        it.doFirst {
            throw new GradleException(
                'composeP1 variant is RETIRED during Compose migration (ledger 7.2): ' +
                'it compiles the whole pages/ staging tree, which always carries in-flight breakage. ' +
                'Use :app:compileComposeUiDebugKotlin (the L1 target) instead.'
            )
        }
    }

    buildTypes {
        debug {
            // Debug build type - no applicationIdSuffix here, handled by flavor
        }
        profile {
            initWith(getByName("debug"))
            matchingFallbacks = ['debug', 'release']
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 签名缺失不再于配置期抛错——配置期对所有 gradle 调用生效，会连带
            // CI 的 testProdDebugUnitTest 等纯 JVM 任务一起失败（CI 无
            // key.properties）。有签名则挂上；没有时改由文件尾 taskGraph
            // 校验，真正请求 release 打包任务时才报同样的错。
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // JVM 单测（:app:testProdDebugUnitTest）默认让 android.jar 的每个方法抛
    // "Method ... not mocked"。CourseWidgetAccent 的 relativeLuminance/rgbToHsl
    // 直接调用 android.graphics.Color.red/green/blue/argb —— 这几个是纯静态位
    // 运算重载，returnDefaultValues 下返回值与真机一致，测试才有意义。不开这个
    // 开关时 CourseWidgetAccentTest 的 8 例必然全红（实测 2026-09-10）。
    // 注意：只会让「未 mock 的 android 方法」返回默认值，不会掩盖被测逻辑本身的失败。
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Compose 编译器插件是模块级应用的，对全部变体的 Kotlin 编译生效；但 Compose
// runtime 只在 composeP1 的 classpath 上。其余变体编译时插件因找不到 runtime
// 抛 IncompatibleComposeRuntimeVersionException，把整条 JVM 单测链连坐
//（2026-10-26 实测 :app:compileProdDebugKotlin 挂）。
//
// KGP 2.2.20 没有公开的「按变体关闭编译器插件」开关（androidComponents 的
// ext 属性与 androidVariantsWithComposePlugin 均不存在，均已实测）。
// 采用社区成熟做法（stackoverflow.com/questions/69449113 的条件依赖形态，
// persian-calendar 项目同款）：把 Compose runtime 也挂到**其余变体**的
// compileOnly 上——插件能找到 runtime 即不报错，runtime 不进产物、不进
// 运行时 classpath，非 P1 变体的行为与加这条之前完全一致。
// 体积影响：compileOnly 不打包，APK 零变化（已用 aapt2 对比核对）。
dependencies {
    compileOnly "org.jetbrains.compose.runtime:runtime-android:1.12.0"
    // 单测源集同样会被 Compose 编译器插件扫到（testProdDebugUnitTestKotlin），
    // testImplementation 把 runtime 也递给测试 classpath（不进 APK）。
    testImplementation "org.jetbrains.compose.runtime:runtime-android:1.12.0"
}

// UmengCrashRedaction 靠反射改写 Throwable.detailMessage（java.lang 的私有
// 字段，java.base 模块不对未命名模块开放）：不加 --add-opens 时 JVM 单测里
// setAccessible(true) 抛 InaccessibleObjectException，脱敏写入静默回退、
// 测不到真实路径。Android（ART）没有模块系统，不受这条限制。
tasks.withType(Test).configureEach { test ->
    test.jvmArgs('--add-opens', 'java.base/java.lang=ALL-UNNAMED')
}

flutter {
    source = "../.."
}

// Work around flutter/flutter#187553: merge*JniLibFolders may stay UP-TO-DATE while
// Flutter jniLibs changed, packaging a stale libapp.so into flavor APKs.
tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("JniLibFolders")) {
        task.outputs.upToDateWhen { false }
    }
}

// 无签名配置时，仅当任务图真的包含 release 打包任务（assemble/bundle 前缀
// + release 名）才报错；纯 JVM 测试/分析任务不被连坐。报错文案与原配置期
// 校验一致，指引不变。CNB/GitHub 发布流水线均注入真实签名，不受影响。
gradle.taskGraph.whenReady { graph ->
    if (hasReleaseSigning) {
        return
    }
    def needsSigning = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        (name.startsWith("assemble") || name.startsWith("bundle")) && name.contains("release")
    }
    if (needsSigning) {
        throw new GradleException(
                "Missing release signing config. Provide android/key.properties or ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
        )
    }
}

// AGP 9 内置 Kotlin（不再应用 kotlin-android 插件，`kotlinOptions` 也随之移除），
// 编译目标改由顶层 `kotlin { compilerOptions }` 指定。
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.umeng.umsdk:common:9.6.3'
    implementation 'com.umeng.umsdk:asms:1.8.0'
    implementation 'com.umeng.umsdk:apm:1.5.2'
    implementation 'com.umeng.umsdk:uyumao:1.1.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    testImplementation 'junit:junit:4.13.2'

    // Compose 迁移 Phase 1：仅 composeP1 变体参与编译打包，其余变体零影响。
    //
    // miuix 0.9.4（2026-10-27 用户拍板「按最新状态对齐，不顾一切」）：
    // 0.9.x 是模块化发布——miuix-ui（基础）/ miuix-preference（官方设置行）/
    // miuix-icons（图标）/ miuix-squircle / miuix-shader 各自独立。
    // 代价（已确认可承受）：其依赖的 Compose 1.12 硬要求 AGP 9.1+ 与 compileSdk 37，
    // 因此本工程同步抬到 AGP 9.4.1 + Gradle 9.8.2 + Kotlin 2.4.21 + compileSdk 37。
    def miuixVersion = '0.9.4'
    composeP1Implementation 'androidx.activity:activity-compose:1.13.0'
    composeP1Implementation "top.yukonga.miuix.kmp:miuix-ui-android:$miuixVersion"
    composeP1Implementation "top.yukonga.miuix.kmp:miuix-preference-android:$miuixVersion"
    composeP1Implementation "top.yukonga.miuix.kmp:miuix-icons-android:$miuixVersion"

    // Phase 3 页面开发壳：与 composeP1 同一套依赖（页面源码共用）。
    composeUiImplementation 'androidx.activity:activity-compose:1.13.0'
    composeUiImplementation "top.yukonga.miuix.kmp:miuix-ui-android:$miuixVersion"
    composeUiImplementation "top.yukonga.miuix.kmp:miuix-preference-android:$miuixVersion"
    composeUiImplementation "top.yukonga.miuix.kmp:miuix-icons-android:$miuixVersion"
}
