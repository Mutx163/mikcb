# -Xmx4G：CI 无 key.properties 修复后首次真正跑到 compileProdDebugKotlin，
# JetifyTransform 处理 io.flutter engine debug 大 JAR 时 2G 堆 OOM（ci run
# 33512744298）；本地/CNB 流水线共用此文件，一并受益。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
# 上一行是为**云端 CI 纯净性**留的（一次性 JVM，跑完即退，不给 CI 留常驻进程）。
# 本地开发由 scripts/safe-gradle.ps1 传 --daemon 覆盖它（命令行优先级高于本文件），
# CI 直接调 gradlew，不受影响。2026-10-27 实测：不覆盖时每次调用的固定开销约 27 秒，
# 当天本机累计启动一次性 JVM ≥577 个、构建耗时合计 8.2 小时。
#
# 常驻 daemon 的空闲退出时间**必须写在这里，不要写进命令行 -D**：daemon 的复用判据
# 包含 idleTimeout，写在命令行会造出「只有走闸门的客户端才认」的独立 daemon，与
# Android Studio / 裸 gradlew 各占一份内存（2026-10-27 实测同机因此并存 2 个 daemon、
# 4 个 JVM 合计 6.8GB，可用内存掉到 4GB）。写在这里则所有客户端收敛到同一个 daemon。
# 10 分钟：够覆盖一轮连续编译，闲下来就把 4G 堆还回去。
org.gradle.daemon.idletimeout=600000
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 弃用警告压制（官方开关，AGP 警告正文里点名给的两个 ID）：
#   UNSUPPORTED_PROJECT_OPTION_USE → 「android.builtInKotlin=false / newDsl=false / enableJetifier=true 已弃用」3 条
#   DEPRECATED_DSL                 → 「API 'applicationVariants' 等已过时」4 条（来自 Flutter 官方插件，非本仓代码）
# 这些开关是 Flutter 迁移器自动加的（builtInKotlin/newDsl）与 Jetifier 必需项（io.flutter engine
# debug JAR 走 JetifyTransform，见上方 jvmargs 注释），不能删，只能压警告。
# 剩下的 19 条「Deprecated 'org.jetbrains.kotlin.android' plugin usage」来自 pub 缓存里每个
# Flutter 插件模块，走 Gradle 警告通道，由 scripts/safe-gradle.ps1 的 --warning-mode none 压制。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
