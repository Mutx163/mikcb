# -Xmx4G：CI 无 key.properties 修复后首次真正跑到 compileProdDebugKotlin，
# JetifyTransform 处理 io.flutter engine debug 大 JAR 时 2G 堆 OOM（ci run
# 33512744298）；本地/CNB 流水线共用此文件，一并受益。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
