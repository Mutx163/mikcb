# 4G 堆：AGP 9 + Kotlin 2.4 + Compose 编译链的实测需求；2G 会在
# compileProdDebugKotlin / R8 阶段 OOM。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -XX:ReservedCodeCacheSize=256m
# 本地/IDE 默认复用常驻 daemon；CI 在各 gradlew 调用上显式 --no-daemon，
# 避免云端留下常驻进程。空闲退出时间必须写在这里（不要写进命令行 -D），
# 让 Android Studio / 裸 gradlew / safe-gradle 收敛到同一个 daemon。
# 10 分钟：够覆盖一轮连续编译，闲下来就把 4G 堆还回去。
org.gradle.daemon.idletimeout=600000
org.gradle.workers.max=4
android.useAndroidX=true
# 去 Flutter 化后不再有需要 Jetify 的旧 support 库；关掉可省一层依赖转换。
android.enableJetifier=false
# AGP 9 弃用警告压制：只保留 builtInKotlin/newDsl 两个迁移期开关，
# 以及仓库里可能残留的 deprecated DSL 警告。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
# Kotlin 增量编译保持默认开启（去 Flutter 化后不再有 pub 缓存插件模块的缓存冲突）。
# AGP 9 内置 Kotlin 迁移完成前，继续由 KGP 编译。
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
