pluginManagement {
    // 去 Flutter 化阶段 1（2026-11-07）：`-PwithFlutter=false` 时**不加入** flutter_tools 的
    // composite build，也不要求 `local.properties` 里有 `flutter.sdk`——没有 Flutter SDK 的机器
    // 也能配置/编译（阶段 2 才真删 Dart）。默认 true ⇒ 与之前行为完全一致。
    //
    // 为什么用「换 includeBuild 指向」而不是「条件 apply」：settings 的 `plugins {}` 只允许
    // `id(..)` 调用（Gradle 9.8.2 实测：`if` 直接报 "only id(String), alias(Provider) ...
    // allowed in plugins {} script block"），而 `apply plugin:` 又拿不到 includeBuild 里的插件类
    // （实测 "Plugin with id 'dev.flutter.flutter-plugin-loader' not found"）。
    // 所以插件请求保持原样，无 Flutter 构型下由仓库内的空实现同 id 顶替。
    // 去 Flutter 化 P4-B（2026-11-07）：flutter_tools 的 composite build 已移除——Dart 层删除后
    // 不再需要它的插件类，也不再要求 local.properties 里有 flutter.sdk。
    // 没有 Flutter SDK 的机器现在可以直接配置 / 编译 / 出包。


    repositories {
        // CNB 流水线专用镜像前置：CNB 出口 IP 对 Maven Central 限流（HTTP 429，
        // kotlin-stdlib POM 下载被拒）。GitHub Actions / 本地构建不设 CNB_* 环境
        // 变量，仓库列表与原先完全一致，不受任何影响。
        if (System.getenv("CNB_BUILD_ID") != null || System.getenv("CNB_BRANCH") != null) {
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
}

plugins {
    id "com.android.application" version "9.4.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
    // Compose 迁移（Phase 1）：仅 composeP1 flavor 启用 Compose 编译器。
    // 插件随 Kotlin 同版本发布，版本必须与 kotlin-android 一致（2026-10-27 随 miuix 0.9.4 抬到 2.4.21）。
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.21" apply false
}

// CNB 专用依赖仓库镜像（仅在 CNB 环境生效，GitHub Actions / 本地不受影响）。
// 去 Flutter 化残件清理（2026-11-08）：原本是给已删除的 Flutter Gradle 插件注入的
// `download.flutter.io` 兜底仓库（见原注的 FlutterPlugin.kt 行为）；P4-B 后引擎 jar 已无消费方，
// 该行与原注一并删除，剩下 google / mavenCentral 两份兜底。
// 注意 settings 脚本里 plugins {} 必须紧随 pluginManagement {}，故本块只能放在 plugins 之后，
// RepositoriesMode 用全限定名（settings 脚本 import 会挤掉 plugins 块位置）。
if (System.getenv("CNB_BUILD_ID") != null || System.getenv("CNB_BRANCH") != null) {
    dependencyResolutionManagement {
        repositoriesMode.set(org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_SETTINGS)
        repositories {
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            google()
            mavenCentral()
        }
    }
}

include ":app"

// miuix-ui 本地 fork（2026-11-03 用户批准「改库」）：弹窗玻璃材质画在官方容器
// `DialogContentLayout` 同一节点里，调用侧封装做不到，所以整份源码进仓。
// 依赖替换接线在 android/build.gradle 的 allprojects 块里，:app 的依赖声明不用改。
include ":third_party:miuix-ui"

// CNB 专用：为所有子项目 buildscript.repositories 注入国内镜像。
// Flutter 插件（device_info_plus 等）的 build.gradle 中 buildscript.repositories
// 仅声明 google()+mavenCentral()，不受 dependencyResolutionManagement 管理，
// 导致 kotlin-gradle-plugin 等 classpath 依赖直连 Maven Central 被限流（HTTP 429）。
// beforeProject 钩子在子项目评估前执行，向 buildscript 仓库列表前端插入国内镜像。
if (System.getenv("CNB_BUILD_ID") != null || System.getenv("CNB_BRANCH") != null) {
    gradle.beforeProject { project ->
        project.buildscript {
            repositories {
                maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
                maven { url 'https://maven.aliyun.com/repository/public' }
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            }
        }
    }
}
