# 版本号唯一事实源（去 Flutter 化 P4 · A 刀：pubspec.yaml 即将删除）。
#
# 为什么单独成文件而不是写死在 build.gradle：发版脚本、CI 的 Read app version、
# 以及 mikcb-release 技能都按「文本里有一行 versionName=」来读，跨语言改起来最省。
#
# 语义与 pubspec 的 `version: <name>+<code>` 一一对应：
#   versionName      ↔ `+` 左边那段（可含 `-`，含 `-` 即预发布）
#   versionCodeBase  ↔ `+` 右边那个整数
# build.gradle 会在此基础上 +100000（分 ABI 打包时代的 versionCode 偏移，防降级误判）。
versionName=2.1.4-2
versionCodeBase=141
