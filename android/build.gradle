allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
}

// miuix-ui 换成本地 fork（android/third_party/miuix-ui，2026-11-03 用户批准「改库」）。
//
// 机制：**依赖替换**而不是改依赖声明——凡是请求
// `top.yukonga.miuix.kmp:miuix-ui-android`（:app 的直接声明、miuix-preference /
// miuix-icons / miuix-nav 的传递依赖都算）一律解析到本地工程，因此不会出现
// 「官方 AAR 与 fork 同名类」的 dex 重复类错误，`app/build.gradle` 也一字不用改。
//
// 回滚：注释/删掉本块 + settings.gradle 里的 `include ":third_party:miuix-ui"`，
// 立即回到官方 AAR（fork 源码留着不参与构建）。
allprojects {
    configurations.configureEach { configuration ->
        configuration.resolutionStrategy.dependencySubstitution {
            substitute module('top.yukonga.miuix.kmp:miuix-ui-android') using project(':third_party:miuix-ui')
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    // 工程内模块的产物统一到仓库根 build/；工程外模块保留各自 buildDir，
    // 避免跨盘相对路径报 "this and base files have different roots"。
    def projectRoot = rootProject.projectDir.parentFile.toPath()
    if (project.projectDir.toPath().startsWith(projectRoot)) {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
}

// app 有 bench 变体；库模块也补一个同名、默认配置的 bench 变体，
// 让 :app 的 bench 变体有可匹配的库变体（库自身不 minify，裁剪交给 app 的 R8）。
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.getByName('android')
        if (androidExt.buildTypes.findByName('bench') == null) {
            androidExt.buildTypes.maybeCreate('bench')
        }
    }
}

// Kotlin 编译目标兜底：
// KGP 未显式指定时会让 jvmTarget 跟随跑 Gradle 的 JVM；这里对应用了
// kotlin-android 的子项目统一钉住，避免 Java/Kotlin target 不一致。
// :app 需要 JVM21（miuix-nav 的 inline entry<T> 是 Java21 字节码），
// 其余子项目保持 17，与 AGP 的 Java 17 baseline 一致。
subprojects { subproject ->
    subproject.plugins.withId('org.jetbrains.kotlin.android') {
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
            // 只把 :app 抬到 21；其余子项目继续钉 17，避免 Java/Kotlin target 不一致。
            task.compilerOptions.jvmTarget.set(
                subproject.name == 'app'
                    ? org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
                    : org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            )
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
