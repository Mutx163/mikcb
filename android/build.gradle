allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://storage.googleapis.com/download.flutter.io"
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    // integration_test 模块（build.gradle 在 Flutter SDK 里）声明的是动态版本
    // androidx.test:runner:1.2+：每次构建都要联网拉 maven-metadata.xml 做版本列举，
    // 而本机到 Maven Central 的 TLS 握手间歇性失败，会把与本次改动无关的任何
    // 构建挂掉（2026-10-26 composeP1 编译连挂两次；本地缓存已有 1.2.0）。
    // 这里显式钉到动态版本实际解析出的 1.2.0，构建从此离线可复现。
    // 复核时机：升级 Flutter SDK 时（integration_test 的声明跟着 SDK 走）。
    project.configurations.all { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            def requested = details.requested
            if (requested.group == 'androidx.test' &&
                    requested.name == 'runner' &&
                    requested.version == '1.2+') {
                details.useVersion('1.2.0')
            }
        }
    }
    project.evaluationDependsOn(":app")
}

subprojects { subproject ->
    // AGP 9 兼容补丁（2026-10-27）：
    // file_picker 11.0.3 与 mobile_scanner 7.4.0 检测到 AGP >= 9 后**不再自行应用**
    // org.jetbrains.kotlin.android，因为 AGP 9 自带 Kotlin 编译。但本工程还有约 20 个
    // Flutter 插件仍自带该插件，一旦打开 AGP 内置 Kotlin 它们会直接报错
    // （"plugin is no longer required since AGP 9.0"），因此全局只能维持
    // android.builtInKotlin=false；代价就是这两个模块的 Kotlin 源码没人编，
    // 表现为 :app:compileXxxJavaWithJavac 找不到 FilePickerPlugin 之类的类。
    // 这里在它们身上补回插件，等价于 AGP 8 下的行为。
    // 移除时机：这两个依赖升到不再跳过 Kotlin 的版本，或全仓 Flutter 插件都迁到内置 Kotlin。
    if (subproject.name == 'file_picker' || subproject.name == 'mobile_scanner') {
        subproject.plugins.withId('com.android.library') {
            subproject.pluginManager.apply('org.jetbrains.kotlin.android')
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
