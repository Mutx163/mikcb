# ─────────────────────────────────────────────────────────────
# 轻屿课表 · CNB 云原生构建流水线
# 覆盖三类场景：
#   1. 任意分支推送  → 质量门禁（analyze + test + 静态审计）
#   2. PR            → 预合并质量门禁（与推送保持一致）
#   3. v* 标签       → 构建发布签名 APK 并挂到 Release
# ─────────────────────────────────────────────────────────────

# ── Flutter 构建环境（YAML 锚点复用）────────────────────────
# 使用仓库内 Dockerfile 构建自定义镜像：基于 cirruslabs/flutter:3.44.0
# 将 Flutter 升级到 .fvmrc 指定的 3.44.8（Dart 3.12.8），
# 满足 pubspec.yaml 的 sdk >=3.12.2 约束。
.flutter-env: &flutter-env
  # 源分支又被推送时终止本次构建：同一分支连续 push 会排队多条内容相同的流水线，
  # 旧的那几条结果与最新 commit 无关，却照常按 5min 粒度冻结核时。开启后只有最新的
  # 那条继续跑，避免为过期的 commit 付费。
  # 安全性：只终止「已被更新的 commit 取代」的构建，不会让最新 commit 漏跑。
  breakIfModify: true
  runner:
    cpus: 8                        # 8 核 16G，与 main 上验证过门禁的规格一致。
                                   # 不要为了省核时往下调：runner 内存 = cpus x 2GiB，
                                   # 而 android/gradle.properties 固定了
                                   #   org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
                                   # Gradle JVM 至少需要 ~5.3G，加上 JVM 自身开销要 6G 以上。
                                   # cpus:1 只有 2G，gradle-jvm-tests 必被 OOM killer 杀掉 ——
                                   # 那是把「配额不足」换成「内存不足」，配额恢复后照样红。
                                   # 真要省核时，靠下面的 breakIfModify 与 gradle-jvm-tests 的
                                   # ifModify 跳过，而不是砍规格。
  docker:
    build:
      dockerfile: ./Dockerfile
      by: [Dockerfile]
      versionBy: [Dockerfile]

# ── 质量门禁公共步骤（推送 / PR 共用）───────────────────────
.quality-stages: &quality-stages
  - name: flutter-version
    script: |
      flutter --version
      dart --version
  - name: pub-get
    script: flutter pub get
  - name: pubspec-encoding-check
    script: |
      set -eu
      if head -c 3 pubspec.yaml | od -An -tx1 | grep -q 'ef bb bf'; then
        echo "ERROR: pubspec.yaml has UTF-8 BOM"; exit 1
      fi
      python3 - <<'PY'
      import sys
      text = open("pubspec.yaml", encoding="utf-8").read()
      for key in ("version:", "description:"):
          line = next((l for l in text.splitlines() if l.startswith(key) and not l[0:1].isspace()), None)
          if line is None:
              print(f"ERROR: missing {key} line in pubspec.yaml", file=sys.stderr)
              sys.exit(1)
          value = line.split(":", 1)[1].strip()
          if not value:
              print(f"ERROR: empty value for {key} in pubspec.yaml", file=sys.stderr)
              sys.exit(1)
      print("pubspec.yaml encoding OK")
      PY
  - name: hyperos-audit
    script: |
      python3 tool/hyperos_audit.py --strict
  - name: cjk-hardcode-audit
    script: python3 tool/audit_cjk_hardcode.py --baseline tool/cjk_hardcode_baseline.txt
  - name: analyze
    script: flutter analyze --fatal-infos
  - name: unit-test
    script: flutter test

# ── Android JVM 单测（Gradle）────────────────────────────────
# 注意：flutter_tools included build 镜像注入必须与 gradle 调用同 stage
# 内联执行——CNB 各 stage 是独立容器，跨 stage 改镜像内文件会丢失。
# GitHub Actions 不执行本文件，不受任何影响。
#
# 注入内容：
# 1) includeBuild 的 flutter_tools/gradle 自带 settings.gradle.kts（仓库仅
#    google+mavenCentral），主构建 settings 的镜像覆盖不到它；CNB 出口对
#    Maven Central 限流（HTTP 429）。在 gradle 构建前为其注入国内镜像。
# 2) Gradle wrapper distribution 从 services.gradle.org 下载时会因 SSL 握手
#    失败，需替换为腾讯云镜像。
# （幂等：已注入则跳过）。
# 核时优化：本 stage 实测 635s，占整条流水线（818s）的 ~78%，且只覆盖
# android/app/src/test 下的纯 JVM 单测（JUnit + java.util，不依赖 Dart/Flutter
# 产物）。变更只落在文档/站点（site/**）、docs/** 与编排文件（.mdx/meta.json）时
# 跳过它，可为每次文档类推送省下约 1.4 核时。
#
# 语义：ifModify 命中 = 存在至少一个变更文件同时满足全部 pattern，故用
# "**" 打底 + 若干 "!(...)" 表达「有任何非文档文件变更才执行」。
#   "**"                            命中任意变更文件
#   "!(site/**)" "!(docs/**)"       排除站点与文档目录
#   "!(**/*.mdx)" "!(**/meta.json)" 排除任意位置的文档与编排文件
#
# 注：只在本 stage 做跳过，不要给 ci/pr-check 两条 pipeline 加同样的
# ifModify —— 那样纯文档 PR 会整条流水线被跳过、stage 全部置 skipped，
# PR 状态检查反而拿不到成功结果。
.jvm-test-stages: &jvm-test-stages
  - name: gradle-jvm-tests
    ifModify:
      - "**"
      - "!(site/**)"
      - "!(**/*.mdx)"
      - "!(**/meta.json)"
      - "!(docs/**)"
    script: |
      set -eu

      # flutter_tools included build 镜像注入（同 stage 内联，规避 429）
      FTG_SETTINGS="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)/packages/flutter_tools/gradle/settings.gradle.kts"
      if [ -f "$FTG_SETTINGS" ] && ! grep -q 'mirrors.cloud.tencent.com' "$FTG_SETTINGS"; then
        sed -i '1i pluginManagement {\n    repositories {\n        maven { url = uri("https://mirrors.cloud.tencent.com/nexus/repository/maven-public/") }\n        maven { url = uri("https://maven.aliyun.com/repository/public") }\n        gradlePluginPortal()\n    }\n}' "$FTG_SETTINGS"
        sed -i 's|^        mavenCentral()$|        maven { url = uri("https://mirrors.cloud.tencent.com/nexus/repository/maven-public/") }\n        mavenCentral()|' "$FTG_SETTINGS"
        echo "flutter_tools gradle 镜像已注入: $FTG_SETTINGS"
      else
        echo "flutter_tools gradle 镜像已存在或文件缺失，跳过注入"
      fi

      # Gradle wrapper distribution 换国内镜像（规避 services.gradle.org 不可达/SSL 失败）
      WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
      if [ -f "$WRAPPER_PROP" ] && ! grep -q 'mirrors.cloud.tencent.com/gradle' "$WRAPPER_PROP"; then
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.14-all.zip|' "$WRAPPER_PROP"
        echo "Gradle distribution 镜像已替换: $WRAPPER_PROP"
      else
        echo "Gradle distribution 镜像已存在或文件缺失，跳过替换"
      fi

      cd android
      echo "Using Gradle distribution: $(grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties)"
      ./gradlew :app:testProdDebugUnitTest --stacktrace --quiet

# ═════════════════════════════════════════════════════════════
# 1. 任意分支推送 → 质量门禁
# 2. PR → 预合并质量门禁
# ═════════════════════════════════════════════════════════════
"**":
  push:
    - name: ci
      <<: *flutter-env
      stages:
        - *quality-stages
        - *jvm-test-stages
  pull_request:
    - name: pr-check
      <<: *flutter-env
      stages:
        - *quality-stages
        - *jvm-test-stages

# ═════════════════════════════════════════════════════════════
# 3. v* 标签 → 构建发布 APK 并挂到 Release
# ═════════════════════════════════════════════════════════════
"$":
  # ── @NPC 事件（issue/PR 评论里 @NPC 触发）──────────────────
  # 重要：NPC 与 push/PR **不共用配额桶**。按 docs /zh/build/npc.md「计费口径」，
  # NPC 视作开发场景，消耗「云原生开发-CPU」（免费 1600 核时/月）；push/PR 门禁
  # 消耗「云原生构建-CPU」（免费 160 核时/月）。
  #
  # 实测佐证（2026-09-10 01:57）：同一分钟内 push / pull_request 两条 1 核流水线
  # 都在 Prepare 被判「构建-CPU 不足 0.08 核时」而 error，紧接着的
  # pull_request.comment@npc 却以 8 核（需 0.67 核时）正常跑完 ——
  # 说明给 NPC 降核**救不了**门禁，两个桶互不相通。
  #
  # 因此这里只显式声明事件、保持默认规格，不再压 cpus：
  # NPC 容器要跑 node + git + 工具链，2G 内存下容易被 OOM，降核得不偿失。
  # 若日后要省的是「云原生开发」用量，应单独评估，不要混入门禁的配额问题。
  #
  # 注意：不要给这两个事件加 ifModify —— 命中跳过会让整条流水线置 skipped，
  # NPC 拿不到执行结果、评论也不会被回复（与 a630933f 撤回 pipeline 级
  # ifModify 是同一个坑）。
  issue.comment@npc:
    - name: npc-issue
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go

  pull_request.comment@npc:
    - name: npc-pr
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go

  tag_push:
    - name: release-apk
      <<: *flutter-env
      # 继承锚点的 8 核 16G。签名 APK 要跑 Gradle + Flutter AOT，内存需求与
      # gradle-jvm-tests 同量级，不能再往下压。tag_push 低频（实测 10 天内 13 次），
      # 为发布成功率保留规格是划算的；配额不足时它会失败，但这是发布动作，
      # 宁可明确失败也不要静默降级成不可用的产物。
      imports:
        # 签名密钥存放在独立密钥仓库（CNB Web 界面维护，禁止 clone/push），
        # 仅为 tag_push 发布流水线注入；push/PR 门禁不接触任何密钥
        - https://cnb.cool/Mutx163/qingyukb-keys/-/blob/main/android-release.yml
      stages:
        - name: pub-get
          script: flutter pub get
        - name: build-release-apk
          script: |
            set -ex
            # ── 签名密钥：由密钥仓库 android-release.yml 经 imports 注入 ──
            # 四件套与 GitHub Actions secrets 同名同源：
            #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
               || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
              echo "ERROR: 缺少 Android release 签名密钥" >&2
              echo "请在 CNB 密钥仓库 Mutx163/qingyukb-keys 维护 android-release.yml（经 imports 注入）:" >&2
              echo "  ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD" >&2
              exit 1
            fi
            # 解码 keystore（对齐 GitHub Actions android-build.yml 的 Prepare signing files）
            # tr -d 先剥掉粘贴时可能混入的空白字符，避免 base64 -d 对长串中途的
            # 空格/换行报 invalid input。
            mkdir -p android/app
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > android/app/upload-keystore.jks
            export ANDROID_KEYSTORE_PATH="app/upload-keystore.jks"

            # 校验 keystore 可用性：base64 损坏 / storepass 不符 / 别名缺失
            # 在这里立刻失败，避免长构建末端才爆或静默产出未签名 APK。
            # set +x 防止 storepass 进入 trace 日志。
            set +x
            if ! keytool -list -keystore android/app/upload-keystore.jks \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
                 | grep -q "$ANDROID_KEY_ALIAS"; then
              echo "ERROR: keystore 校验失败（base64 损坏、storepass 不符或别名 $ANDROID_KEY_ALIAS 缺失）" >&2
              set -x
              exit 1
            fi
            echo "keystore 校验通过（别名 $ANDROID_KEY_ALIAS 存在）"
            set -x

            # ── flutter_tools included build 镜像注入（同 stage 内联，规避 429）──
            # includeBuild 的 flutter_tools/gradle 自带 settings.gradle.kts（仓库仅
            # google+mavenCentral），主构建 settings 的镜像覆盖不到它；CNB 出口对
            # Maven Central 限流（HTTP 429）。必须在同 stage 内、flutter build 前
            # 就地注入（跨 stage 容器隔离，单独 stage 改镜像文件会丢失）。
            FTG_SETTINGS="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)/packages/flutter_tools/gradle/settings.gradle.kts"
            if [ -f "$FTG_SETTINGS" ] && ! grep -q 'mirrors.cloud.tencent.com' "$FTG_SETTINGS"; then
              sed -i '1i pluginManagement {\n    repositories {\n        maven { url = uri("https://mirrors.cloud.tencent.com/nexus/repository/maven-public/") }\n        maven { url = uri("https://maven.aliyun.com/repository/public") }\n        gradlePluginPortal()\n    }\n}' "$FTG_SETTINGS"
              sed -i 's|^        mavenCentral()$|        maven { url = uri("https://mirrors.cloud.tencent.com/nexus/repository/maven-public/") }\n        mavenCentral()|' "$FTG_SETTINGS"
              echo "flutter_tools gradle 镜像已注入: $FTG_SETTINGS"
            fi

            # Gradle wrapper distribution 换国内镜像（规避 services.gradle.org 不可达/SSL 失败）
            WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$WRAPPER_PROP" ] && ! grep -q 'mirrors.cloud.tencent.com/gradle' "$WRAPPER_PROP"; then
              sed -i 's|distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.14-all.zip|' "$WRAPPER_PROP"
              echo "Gradle distribution 镜像已替换: $WRAPPER_PROP"
            else
              echo "Gradle distribution 镜像已存在或文件缺失，跳过替换"
            fi

            VERSION_NAME="${CNB_BRANCH#v}"
            flutter build apk --release --flavor prod --target-platform android-arm64

            mkdir -p dist
            APK_PATH=""
            for candidate in \
              "build/app/outputs/flutter-apk/app-prod-release.apk" \
              "build/app/outputs/apk/prod/release/app-prod-release.apk"; do
              if [ -f "${candidate}" ]; then
                APK_PATH="${candidate}"
                break
              fi
            done
            if [ -z "${APK_PATH}" ]; then
              echo "ERROR: could not find release APK under build/app/outputs" >&2
              exit 1
            fi
            cp "${APK_PATH}" "dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"
            ls -lh dist/
        - name: create-release
          type: git:release
          options:
            title: "$CNB_BRANCH"
            description: "轻屿课表自动构建发布（CNB 流水线）"
        - name: upload-apk-to-release
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "dist/*.apk"
      failStages:
        - name: notify-release-failure
          script: |
            echo "Release APK 构建失败: $CNB_BRANCH"
            echo "失败信息: $CNB_BUILD_FAILED_MSG"
      endStages:
        - name: cleanup-artifacts
          # 一并清掉签名密钥落盘文件，不在构建容器工作区残留
          script: rm -rf dist build android/app/upload-keystore.jks
