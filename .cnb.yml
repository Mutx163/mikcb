# ─────────────────────────────────────────────────────────────
# 轻屿课表 · CNB 云原生构建流水线
# 覆盖三类场景：
#   1. 任意分支推送  → JVM 单测闸（Gradle `:app:testProdDebugUnitTest`）
#   2. PR            → 预合并 JVM 单测闸（与推送保持一致）
#   3. v* 标签       → 构建发布签名 APK 并挂到 Release
# ─────────────────────────────────────────────────────────────

# ── 构建环境（YAML 锚点复用）────────────────────────
# 镜像基于 cirruslabs/flutter（该镜像实质是含 JDK/Android SDK 的通用 Android 构建镜像；
# 早期 Flutter 插件挂着它才要装 Flutter SDK，P4-B 后构建不再依赖 Flutter SDK，
# 镜像保留只为继续提供 JDK 与 Android SDK）。
.build-env: &build-env
  # 源分支又被推送时终止本次构建：同一分支连续 push 会排队多条内容相同的流水线，
  # 旧的那几条结果与最新 commit 无关，却照常按 5min 粒度冻结核时。开启后只有最新的
  # 那条继续跑，避免为过期的 commit 付费。
  # 安全性：只终止「已被更新的 commit 取代」的构建，不会让最新 commit 漏跑。
  breakIfModify: true
  runner:
    cpus: 8                        # 8 核 16G，与 main 上验证过门禁的规格一致。
                                   # 不要为了省核时往下调：runner 内存 = cpus x 2GiB，
                                   # 而 android/gradle.properties 固定了
                                   #   org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
                                   # Gradle JVM 至少需要 ~5.3G，加上 JVM 自身开销要 6G 以上。
                                   # cpus:1 只有 2G，gradle-jvm-tests 必被 OOM killer 杀掉 ——
                                   # 那是把「配额不足」换成「内存不足」，配额恢复后照样红。
                                   # 真要省核时，靠下面的 breakIfModify 与 gradle-jvm-tests 的
                                   # ifModify 跳过，而不是砍规格。
  docker:
    build:
      dockerfile: ./Dockerfile
      by: [Dockerfile]
      versionBy: [Dockerfile]

# ── JVM 单测脚本（YAML 锚点复用）──────────────────────────
# 为什么抽成字符串锚点、而不是拆成独立 stage：Gradle 的仓库镜像/inject 必须与 gradle
# 调用**同 stage 内联执行**——CNB 各 stage 是独立容器，跨 stage 改镜像内文件会丢失。
# 抽成 anchor 后，**任何新加的、要调 ./gradlew 的 stage 都直接 `script: *jvm-test-script`
# （或照抄这段镜像替换）**，免得又漏掉国内镜像导致卡 services.gradle.org 的 SSL 握手。
# （GitHub Actions 不执行本文件，不受影响。）
#
# 注入内容（现只剩 1 项）：
# Gradle wrapper distribution 从 services.gradle.org 下载时会因 SSL 握手
# 失败，需替换为腾讯云镜像。
# （幂等：已注入则跳过）。
#
# 去 Flutter 化残件清理（2026-11-08）：原先还有针对 flutter_tools included build 的
# settings 镜像注入（给已删除的 Flutter Gradle 插件拉国内镜像）。P4-B 后该目录不存在，
# 注入分支只剩「缺失，跳过」——纯残件，已删除。CNB 仍需仓库级镜像的话，应改在主构建的
# settings.gradle 注入（已由 android/settings.gradle 的 CNB 块覆盖）。
#
# 去 Flutter 化 P4-D（2026-11-07）：Dart 层已删除，原先的
# flutter-version / pub-get / pubspec 编码校验 / hyperos-audit / cjk 审计 /
# analyze / flutter test 全部失效（它们的输入 lib/ 与 pubspec.yaml 已不存在），
# 统一换成下面这条 Gradle 的 JVM 单测。
.jvm-test-script: &jvm-test-script |
  set -eu

  # crossguard 依赖（2026-11-12）：JVM 单测里的 CrossDomainGateGuardTest 会**真的**起子进程
  # `pwsh`（compose-style-lint.ps1）与 `python3`（i18n-copy-gap.py）。镜像由 ./Dockerfile
  # 构建（其中已装 PowerShell 7 与 python3），这里再 fail-fast 自证一次：缺工具当场红，
  # 别让它表现成「样式/文案门禁失败」。
  command -v pwsh >/dev/null 2>&1 || { echo "ERROR: 镜像缺 pwsh（见 Dockerfile 的 PowerShell 安装层）"; exit 1; }
  command -v python3 >/dev/null 2>&1 || { echo "ERROR: 镜像缺 python3"; exit 1; }
  echo "crossguard toolchain: $(pwsh -v | head -1) / $(python3 -V 2>&1)"

  # Gradle wrapper distribution 换国内镜像（规避 services.gradle.org 不可达/SSL 失败）
  WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
  if [ -f "$WRAPPER_PROP" ] && ! grep -q 'mirrors.cloud.tencent.com/gradle' "$WRAPPER_PROP"; then
    sed -i 's|distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-9.8.2-all.zip|' "$WRAPPER_PROP"
    echo "Gradle distribution 镜像已替换: $WRAPPER_PROP"
  else
    echo "Gradle distribution 镜像已存在或文件缺失，跳过替换"
  fi

  cd android
  echo "Using Gradle distribution: $(grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties)"
  # 变体口径：CI / 发布链一律 prod（本文件、ci.yml、android-build.yml 三处同一条命令）；
  # 本地 L2 可以用 dev（scripts/safe-gradle.ps1 默认 :app:testDevDebugUnitTest）——
  # 两者跑的是同一份 src/test，dev 只是包名多 .debug，闸门价值相同。
  ./gradlew :app:testProdDebugUnitTest --stacktrace --quiet --no-daemon

# ── Android JVM 单测（Gradle，文档类变更可跳过）────────────────
# 这是本文件里**唯一**跑 JVM 单测的 stage。原先还有一条 `jvm-unit-test`（无 ifModify，
# 无条件跑）排在它前面，同一条 pipeline 因此把全量单测跑两遍（各 ~635s），而且那条
# 把文档类跳过优化整个废掉了——审计 P1-1，2026-11-11 已删。要加新的 gradle stage，
# 请复用上面 `jvm-test-script` 锚点，不要再写一份裸 `./gradlew`。
#
# 核时优化：本 stage 实测 635s，占整条流水线（818s）的 ~78%，且只覆盖
# android/app/src/test 下的纯 JVM 单测（JUnit + java.util，不依赖 Dart/Flutter
# 产物）。变更只落在文档/站点（site/**）、docs/** 与编排文件（.mdx/meta.json）时
# 跳过它，可为每次文档类推送省下约 1.4 核时。
#
# 语义：ifModify 命中 = 存在至少一个变更文件同时满足全部 pattern，故用
# "**" 打底 + 若干 "!(...)" 表达「有任何非文档文件变更才执行」。
#   "**"                            命中任意变更文件
#   "!(site/**)" "!(docs/**)"       排除站点与文档目录
#   "!(**/*.mdx)" "!(**/meta.json)" 排除任意位置的文档与编排文件
#
# 注 1：只在本 stage 做跳过，不要给 ci/pr-check 两条 pipeline 加同样的
# ifModify —— 那样纯文档 PR 会整条流水线被跳过、stage 全部置 skipped，
# PR 状态检查反而拿不到成功结果。
# 注 2（P1-1 删掉重复 stage 之后的新形状）：纯文档推送时本 stage 被跳过，流水线上就
# 没有「真的跑过」的 stage 了。CNB 对「全 skipped」流水线怎么回报状态**没实测过**
# （门禁自 2026-09-03 起因配额耗尽根本跑不起来）。配额恢复后第一次纯文档 PR 请核对
# PR check 是否仍能拿到 success；拿不到就补一个只 echo 的常驻 stage 兜底，别把 ifModify 摘掉。
.jvm-test-stages: &jvm-test-stages
  - name: gradle-jvm-tests
    ifModify:
      - "**"
      - "!(site/**)"
      - "!(**/*.mdx)"
      - "!(**/meta.json)"
      - "!(docs/**)"
    script: *jvm-test-script

# ═════════════════════════════════════════════════════════════
# 1. 任意分支推送 → JVM 单测闸
# 2. PR → 预合并 JVM 单测闸
# ═════════════════════════════════════════════════════════════
"**":
  push:
    - name: ci
      <<: *build-env
      stages:
        - *jvm-test-stages
  pull_request:
    - name: pr-check
      <<: *build-env
      stages:
        - *jvm-test-stages

# ═════════════════════════════════════════════════════════════
# 3. v* 标签 → 构建发布 APK 并挂到 Release
# ═════════════════════════════════════════════════════════════
"$":
  # ── 门禁长期不可用：根组织「云原生构建-CPU」配额耗尽（2026-09-03 起）──
  # 自 2026-09-03 11:42 起，本仓库所有 push / pull_request / tag_push 流水线
  # 都在 Prepare 阶段直接 error，报错固定为：
  #   Root Group's events CPU core-hours are insufficient for pre-freezing
  #   (Freezing time:5.00 min, equivalent to 0.67 core-hours)
  # 即根组织 Mutx163 的「云原生构建-CPU」免费额度（160 核时/月）已耗尽。
  # 这是**账号级配额**，`.cnb.yml` 里再怎么省规格都救不回来，只能由根组织
  # 管理员提额，或等额度按自然月刷新。
  #
  # 实测对照（2026-09-10 同一分钟并发，`cnb build get-build-logs`）：
  #   09:32:38 push         auto/fix-header-frost-25aa  error 8868ms   ← 构建桶
  #   09:32:45 pull_request auto/fix-header-frost-25aa  error 11730ms  ← 构建桶
  #   09:32:55 pull_request.comment@npc 同一分支        正常拉起        ← 开发桶
  # NPC 走「云原生开发-CPU」（1600 核时/月），与门禁**不共用配额桶**，
  # 因此 NPC 任务照跑，但 PR 状态检查会一直红 —— 这不是代码问题。
  #
  # 计费粒度：平台按 5 分钟步长预冻结（8cpus → 0.67 核时/次），一条空流水线
  # 失败也要扣满 0.67 核时；这就是 09-01 以来 200+ 条 error 的主因。
  # 结论：先向根组织管理员申请提升「云原生构建-CPU」；配额恢复前不要靠降
  # cpus 省配额（见上文 runner 注释：降核会让 gradle-jvm-tests OOM）。

  # ── @NPC 事件（issue/PR 评论里 @NPC 触发）──────────────────
  # 重要：NPC 与 push/PR **不共用配额桶**。按 docs /zh/build/npc.md「计费口径」，
  # NPC 视作开发场景，消耗「云原生开发-CPU」（免费 1600 核时/月）；push/PR 门禁
  # 消耗「云原生构建-CPU」（免费 160 核时/月）。
  #
  # 实测佐证（2026-09-10 01:57）：同一分钟内 push / pull_request 两条 1 核流水线
  # 都在 Prepare 被判「构建-CPU 不足 0.08 核时」而 error，紧接着的
  # pull_request.comment@npc 却以 8 核（需 0.67 核时）正常跑完 ——
  # 说明给 NPC 降核**救不了**门禁，两个桶互不相通。
  #
  # 因此这里只显式声明事件、保持默认规格，不再压 cpus：
  # NPC 容器要跑 node + git + 工具链，2G 内存下容易被 OOM，降核得不偿失。
  # 若日后要省的是「云原生开发」用量，应单独评估，不要混入门禁的配额问题。
  #
  # 注意：不要给这两个事件加 ifModify —— 命中跳过会让整条流水线置 skipped，
  # NPC 拿不到执行结果、评论也不会被回复（与 a630933f 撤回 pipeline 级
  # ifModify 是同一个坑）。
  issue.comment@npc:
    - name: npc-issue
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go

  pull_request.comment@npc:
    - name: npc-pr
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go

  tag_push:
    - name: release-apk
      <<: *build-env
      # 继承锚点的 8 核 16G。签名 APK 要跑 Gradle + Flutter AOT，内存需求与
      # gradle-jvm-tests 同量级，不能再往下压。tag_push 低频（实测 10 天内 13 次），
      # 为发布成功率保留规格是划算的；配额不足时它会失败，但这是发布动作，
      # 宁可明确失败也不要静默降级成不可用的产物。
      imports:
        # 签名密钥存放在独立密钥仓库（CNB Web 界面维护，禁止 clone/push），
        # 仅为 tag_push 发布流水线注入；push/PR 门禁不接触任何密钥
        - https://cnb.cool/Mutx163/qingyukb-keys/-/blob/main/android-release.yml
      stages:
        - name: build-release-apk
          script: |
            set -e
            # 只开 errexit，**不开 xtrace**。
            # 下面几行会展开 ANDROID_KEYSTORE_BASE64（= 上传签名 keystore 私钥原件）
            # 与 ANDROID_KEYSTORE_PASSWORD；xtrace 打印的是展开后的值而非字面量，
            # 一旦开启，私钥就整段进构建日志。拿到 base64 + 别处 alias 密码即可
            # 伪造同签名 APK。下方 keytool 校验段自己负责在需要时局部开/关 xtrace。
            # ── 签名密钥：由密钥仓库 android-release.yml 经 imports 注入 ──
            # 四件套与 GitHub Actions secrets 同名同源：
            #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
               || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
              echo "ERROR: 缺少 Android release 签名密钥" >&2
              echo "请在 CNB 密钥仓库 Mutx163/qingyukb-keys 维护 android-release.yml（经 imports 注入）:" >&2
              echo "  ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD" >&2
              exit 1
            fi
            # 解码 keystore（对齐 GitHub Actions android-build.yml 的 Prepare signing files）
            # tr -d 先剥掉粘贴时可能混入的空白字符，避免 base64 -d 对长串中途的
            # 空格/换行报 invalid input。
            mkdir -p android/app
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > android/app/upload-keystore.jks
            export ANDROID_KEYSTORE_PATH="app/upload-keystore.jks"

            # 校验 keystore 可用性：base64 损坏 / storepass 不符 / 别名缺失
            # 在这里立刻失败，避免长构建末端才爆或静默产出未签名 APK。
            # set +x 是防御性的：本 stage 开头已用 `set -e`（无 xtrace），
            # 这里再关一次是为了「日后有人把开头的 xtrace 加回来」也不至于
            # 让 storepass 进日志。
            set +x
            if ! keytool -list -keystore android/app/upload-keystore.jks \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
                 | grep -q "$ANDROID_KEY_ALIAS"; then
              echo "ERROR: keystore 校验失败（base64 损坏、storepass 不符或别名 $ANDROID_KEY_ALIAS 缺失）" >&2
              exit 1
            fi
            echo "keystore 校验通过（别名 $ANDROID_KEY_ALIAS 存在）"
            # 密钥处理到此结束，往下不再展开任何密钥相关变量（已逐行核对
            # 后续区段：只用文件路径与 CNB_BRANCH），这里恢复 xtrace 让构建
            # 日志保留可读的逐步 trace。
            set -x

            # 去 Flutter 化残件清理（2026-11-08）：原先这里还有针对 flutter_tools included build 的
            # settings 镜像注入（P4-B 后该目录已删，注入分支恒为 no-op）。CNB 仍需国内镜像的话，
            # 应改在主构建的 settings.gradle 仓库级注入（已由 android/settings.gradle 的 CNB 块覆盖）。

            # Gradle wrapper distribution 换国内镜像（规避 services.gradle.org 不可达/SSL 失败）
            WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$WRAPPER_PROP" ] && ! grep -q 'mirrors.cloud.tencent.com/gradle' "$WRAPPER_PROP"; then
              sed -i 's|distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-9.8.2-all.zip|' "$WRAPPER_PROP"
              echo "Gradle distribution 镜像已替换: $WRAPPER_PROP"
            else
              echo "Gradle distribution 镜像已存在或文件缺失，跳过替换"
            fi

            VERSION_NAME="${CNB_BRANCH#v}"
            # 去 Flutter 化阶段 2 · P2：出包改走 Gradle 原生任务（ARM64 由 app/build.gradle
            # 的 abiFilters 限定），版本号仍通过 OVERRIDE_VERSION_NAME 注入，语义不变。
            (cd android && OVERRIDE_VERSION_NAME="$VERSION_NAME" ./gradlew :app:assembleProdRelease --no-daemon)

            mkdir -p dist
            APK_PATH=""
            for candidate in \
              "build/app/outputs/flutter-apk/app-prod-release.apk" \
              "build/app/outputs/apk/prod/release/app-prod-release.apk"; do
              if [ -f "${candidate}" ]; then
                APK_PATH="${candidate}"
                break
              fi
            done
            if [ -z "${APK_PATH}" ]; then
              echo "ERROR: could not find release APK under build/app/outputs" >&2
              exit 1
            fi
            cp "${APK_PATH}" "dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"
            ls -lh dist/
        - name: create-release
          type: git:release
          options:
            title: "$CNB_BRANCH"
            description: "轻屿课表自动构建发布（CNB 流水线）"
        - name: upload-apk-to-release
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "dist/*.apk"
      failStages:
        - name: notify-release-failure
          script: |
            echo "Release APK 构建失败: $CNB_BRANCH"
            echo "失败信息: $CNB_BUILD_FAILED_MSG"
      endStages:
        - name: cleanup-artifacts
          # 一并清掉签名密钥落盘文件，不在构建容器工作区残留
          script: rm -rf dist build android/app/upload-keystore.jks
