name: Release Permission Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe release create/delete via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Mutx163/mikcb
        run: |
          set -x
          gh api repos/Mutx163/mikcb/releases -f tag_name=probe-test -f name=probe-test 2>&1 || echo "CREATE_FAILED"
          gh release view probe-test 2>&1 || true
          gh release delete probe-test --yes --cleanup-tag 2>&1 || true
