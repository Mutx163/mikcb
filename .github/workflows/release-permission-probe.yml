name: Release Permission Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Matrix probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Mutx163/mikcb
        run: |
          set -x
          echo "C: gh release create minimal (no asset/target/notes)"
          gh release create probe-c --title probe-c 2>&1 || echo "C_FAILED"
          gh release delete probe-c --yes --cleanup-tag 2>&1 || true
          echo "D: gh release create with asset only"
          echo x > a.apk
          gh release create probe-d a.apk 2>&1 || echo "D_FAILED"
          gh release delete probe-d --yes --cleanup-tag 2>&1 || true
          echo "E: gh release create with --target only"
          gh release create probe-e --title probe-e --target f06c661b0bcf600dd3d328652ed405c699b5527a 2>&1 || echo "E_FAILED"
          gh release delete probe-e --yes --cleanup-tag 2>&1 || true
          echo "F: gh api with full body (prerelease+target+body, no asset)"
          gh api repos/Mutx163/mikcb/releases -f tag_name=probe-f -f name=probe-f -F prerelease=true -f target_commitish=f06c661b0bcf600dd3d328652ed405c699b5527a -f body='notes' 2>&1 || echo "F_FAILED"
          gh release delete probe-f --yes --cleanup-tag 2>&1 || true
