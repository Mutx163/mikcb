name: Update Site Stats

# 官网首页的星标数 / 版本数不能由浏览器直接请求 api.github.com（国内网络经常不通，
# 页面就只剩「—」）。这里在 GitHub 侧定时抓一次，写成同域静态文件 docs/site-stats.json，
# 浏览器只读 163366.xyz 自己的文件。运行时实时刷新只作锦上添花（docs/script.js）。

on:
  schedule:
    # 每 6 小时抓一次：星标变化不需要更实时，够用且省额度
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Fetch GitHub stats and commit site-stats.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 抓不到就保留旧文件（脚本内部吞掉异常、退出码 0），下一次定时再试。
      - name: Fetch stars and release count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/build_site_stats.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          commit_message: "chore(docs): auto-update site stats json"
          file_pattern: docs/site-stats.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
