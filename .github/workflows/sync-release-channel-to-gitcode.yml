name: Sync release channel to GitCode

# 为什么需要这一条：
# android-build.yml 里的 GitCode 同步只在**推送 v* tag** 时跑，而且渠道（pre/latest）
# 取的是那一刻 pubspec 里有没有 `-`。而「把预发布原地转成正式版」在 GitHub 上只是
# 改一个勾选框（release: released 事件），**不会再推 tag** —— GitCode 那边因此永远
# 停留在「预发布」，国内渠道的用户（更新源选 GitCode 时读的是 GitCode 的 releases
# 接口）就收不到正式版提示。
#
# 这里订阅 GitHub 的 release 事件（含撤回与删除），让 GitCode 跟着变：
# 以后只在 GitHub 改一处，两边自动一致。
#
# GitCode 的 release 对象没有 id 字段，不能走标准 Gitee/Gitea 的
# PATCH /releases/{id}；与 nvdacn/sync_to_gitcode 一致，按 tag 直接操作
# /releases/{tag}，渠道用 release_status: pre | latest 表示。

on:
  release:
    # released：预发布 → 正式；prereleased：正式 → 预发布；edited：改勾选或改正文
    # unpublished：转成草稿（= 从用户眼前撤回）；deleted：release 被删掉
    types: [published, released, prereleased, edited, unpublished, deleted]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to sync (e.g. v2.1.2.1)'
        required: false
        type: string
      prerelease:
        description: 'Mark as prerelease on GitCode (sync mode only)'
        required: false
        type: boolean
        default: false
      mode:
        description: 'sync = 同步渠道标志；delete = 删除 GitCode 上的该 release'
        required: false
        type: choice
        default: sync
        options: [sync, delete]

concurrency:
  group: gitcode-release-channel-${{ github.event.release.tag_name || inputs.tag_name }}
  # 不能取消：正在跑的同步被中断会留下两边渠道不一致的状态
  cancel-in-progress: false

jobs:
  sync-channel:
    name: Sync release channel to GitCode
    # 与 android-build.yml 的 GitCode 任务同款门禁：没配 GitCode 就整条跳过，
    # Fork 仓库未配置也不会失败。
    if: ${{ vars.GITCODE_USERNAME }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Resolve target state
        id: state
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
            case "$EVENT_ACTION" in
              deleted) MODE=delete ;;
              # GitHub 的「取消发布」= 转成草稿。GitCode 没有草稿概念：
              # 这里降级成预发布（可逆，重新发布时能自动回到 latest），
              # 而不是直接删掉 —— 删除会连带丢掉 APK 附件，重新发布时无法自愈。
              unpublished) MODE=sync; PRERELEASE=true ;;
              *)
                MODE=sync
                case "$EVENT_PRERELEASE" in
                  true) PRERELEASE=true ;;
                  *) PRERELEASE=false ;;
                esac
                ;;
            esac
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            MODE="$INPUT_MODE"
            case "$INPUT_PRERELEASE" in
              true) PRERELEASE=true ;;
              *) PRERELEASE=false ;;
            esac
          else
            echo "::error::没拿到 tag —— 既不是 release 事件，也没填 tag_name"
            exit 1
          fi
          [ "$MODE" = "delete" ] || PRERELEASE="${PRERELEASE:-false}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "目标：$TAG（mode=$MODE，prerelease=${PRERELEASE:-false}）"

      - name: Sync channel flag to GitCode
        if: steps.state.outputs.mode == 'sync'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY || github.repository }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
          TAG: ${{ steps.state.outputs.tag }}
          PRERELEASE: ${{ steps.state.outputs.prerelease }}
          EVENT_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          BASE="https://api.gitcode.com/api/v5/repos/${GITCODE_REPOSITORY}"
          if [ "$PRERELEASE" = "true" ]; then STATUS=pre; else STATUS=latest; fi

          CODE=$(curl -L -sS -o /dev/null -w "%{http_code}" \
            -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" -H "Accept: application/json" \
            "${BASE}/releases/tags/${TAG}")
          if [ "$CODE" != "200" ]; then
            echo "GitCode 上还没有 ${TAG} 的 release（HTTP ${CODE}）—— 跳过，不创建空版本"
            exit 0
          fi

          # 正文：release 事件自带；手动触发时回 GitHub 取，避免把正文覆盖成空
          BODY="$EVENT_BODY"
          if [ -z "$BODY" ]; then
            BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY_SLUG" --json body --jq .body)
          fi

          # 走 jq 构造 JSON：正文里的换行 / 引号不会破坏报文
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg status "$STATUS" --arg body "$BODY" \
            '{tag_name: $tag, name: $tag, body: $body, release_status: $status}')

          RESP_FILE="$(mktemp)"
          CODE=$(curl -L -sS -o "$RESP_FILE" -w "%{http_code}" -X PATCH \
            -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "$PAYLOAD" "${BASE}/releases/${TAG}")
          echo "PATCH ${TAG} -> release_status=${STATUS}（HTTP ${CODE}）"
          if [ "$CODE" != "200" ]; then
            echo "::error::GitCode 渠道同步失败（HTTP ${CODE}）"
            cat "$RESP_FILE"
            exit 1
          fi
          echo "✅ GitCode 渠道已同步为 ${STATUS}"

      - name: Delete release on GitCode
        if: steps.state.outputs.mode == 'delete'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPOSITORY: ${{ vars.GITCODE_REPOSITORY || github.repository }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://api.gitcode.com/api/v5/repos/${GITCODE_REPOSITORY}"
          # GitCode 的 release 没有 id，删除只能按 tag 试；且它是否暴露 DELETE
          # 取决于版本（实测 /releases/{tag} 会返回 405 METHOD_NOT_ALLOWED）。
          # 两条候选依次尝试，都不行就报红，附 API 原文，方便直接照着处理。
          for CANDIDATE in "releases/${TAG}" "releases/tags/${TAG}"; do
            RESP_FILE="$(mktemp)"
            CODE=$(curl -L -sS -o "$RESP_FILE" -w "%{http_code}" -X DELETE \
              -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" -H "Accept: application/json" \
              "${BASE}/${CANDIDATE}")
            echo "DELETE ${CANDIDATE}（HTTP ${CODE}）"
            case "$CODE" in
              200|204)
                echo "✅ 已删除 GitCode 上的 ${TAG}"
                exit 0
                ;;
              404)
                echo "GitCode 上本来就没有 ${TAG}—— 无需删除"
                exit 0
                ;;
              *)
                LAST_CODE="$CODE"
                LAST_BODY="$(cat "$RESP_FILE")"
                ;;
            esac
          done

          # 删除不被支持（实测 405）→ 兜底：把该版本降级为预发布并在正文标注撤回。
          # 这样国内渠道不会继续把它当"正式版"推给用户；不算完美下线（附件还在），
          # 但比留在 latest 上强，且是可逆的：重新发布时会自动回到 latest。
          CHECK=$(curl -L -sS -o /dev/null -w "%{http_code}" \
            -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" -H "Accept: application/json" \
            "${BASE}/releases/tags/${TAG}")
          if [ "$CHECK" = "404" ]; then
            echo "GitCode 上本来就没有 ${TAG}—— 无需处理"
            exit 0
          fi
          if [ "$CHECK" != "200" ]; then
            # 只有 404 能断定"不存在"；5xx/401/403 等说明状态未知，
            # 静默跳过会让该版本继续以正式版留在渠道上，必须报红让人处理。
            echo "::error::确认 ${TAG} 在 GitCode 上是否存在时失败（HTTP ${CHECK}）—— 版本状态未知，请人工检查"
            exit 1
          fi

          echo "::warning::GitCode 的 API 不支持删除 release（HTTP ${LAST_CODE}）：${LAST_BODY}"
          OLD_BODY=$(curl -L -sS -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" \
            -H "Accept: application/json" "${BASE}/releases/tags/${TAG}" | jq -r '.body // ""')
          NOTE="⚠️ 该版本已撤回，请勿使用。"
          # 换行用 printf 拼，不写字面换行：YAML 块里顶格的续行会被当成新的键
          NEW_BODY=$(printf '%s\n\n%s' "$NOTE" "$OLD_BODY")
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg body "$NEW_BODY" \
            '{tag_name: $tag, name: $tag, body: $body, release_status: "pre"}')
          RESP_FILE="$(mktemp)"
          CODE=$(curl -L -sS -o "$RESP_FILE" -w "%{http_code}" -X PATCH \
            -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "$PAYLOAD" "${BASE}/releases/${TAG}")
          if [ "$CODE" != "200" ]; then
            echo "::error::降级 GitCode 上的 ${TAG} 也失败了（HTTP ${CODE}）—— 请到 GitCode 网页手动下线该版本"
            cat "$RESP_FILE"
            exit 1
          fi
          echo "已把 GitCode 上的 ${TAG} 降级为预发布并标注「已撤回」；如需彻底下线请到 GitCode 网页删除该版本"
