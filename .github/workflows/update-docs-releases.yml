name: Update Docs Releases JSON

on:
  release:
    # 监听发布新版本、编辑已发布版本（如从预发布改为正式版）、撤销发布等行为
    types: [published, edited, unpublished, deleted, prereleased, released]
  schedule:
    # 防止 GitHub release 事件偶发漏触发，定时重建官网静态版本数据
    - cron: "17 */6 * * *"
  workflow_dispatch: # 允许在 Actions 面板手动触发

concurrency:
  # Schools and releases both rewrite sitemap/pages; serialize their commits.
  # cancel-in-progress 必须为 false：release 事件触发时若取消正在运行的
  # 定时任务，会静默丢一次数据同步（与 serialize 语义一致）。
  group: docs-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 需要写入代码仓库的权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # main 要求「改动必须走 PR」，而个人仓库的经典分支保护**不支持**
          # 「允许绕过」名单（API 会拒：Only organization repositories can have
          # users and team restrictions），内置的 GITHUB_TOKEN 因此推不上去。
          # 配了 DOCS_PUSH_TOKEN（有仓库写权限的 PAT）时用它推送 = 以仓库所有者
          # 身份推，保护规则的 enforce_admins 为 false，管理员可直推 → 绕过。
          # 没配就退回内置 token，行为与以前一致（会推失败，但不影响生成）。
          token: ${{ secrets.DOCS_PUSH_TOKEN != '' && secrets.DOCS_PUSH_TOKEN || github.token }}

      - name: Fetch Latest Releases and Generate JSON
        env:
          # secret 不能内插进 run：它会出现在 runner 的进程 argv 里（同机其他进程
          # 可读到），并且下一步的 curl --location 会把自定义 Authorization 头在
          # 重定向后继续重放。改为走 env，并显式禁止跟随重定向 —— GitHub Releases
          # API 对这些端点不做跳转。
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching latest releases from GitHub API..."
          mkdir -p docs/releases
          : > /tmp/releases.jsonl
          page=1
          while :; do
            curl --fail --silent --show-error --max-redirs 0 \
                 -H "Authorization: Bearer $GH_API_TOKEN" \
                 -H "Accept: application/vnd.github.v3+json" \
                 "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page=$page" \
                 > "/tmp/releases-page.json"
            if node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/releases-page.json","utf8")); if (!Array.isArray(value)) throw new Error("GitHub releases API response must be a JSON array"); fs.appendFileSync("/tmp/releases.jsonl", JSON.stringify(value)+"\n"); if (value.length === 0) process.exit(10);'; then
              page=$((page + 1))
            else
              status=$?
              if [ "$status" -eq 10 ]; then break; fi
              exit "$status"
            fi
          done
          node <<'EOF'
          const fs = require("fs");
          const pages = fs.readFileSync("/tmp/releases.jsonl", "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if (!pages.every(Array.isArray)) throw new Error("GitHub releases pages must be JSON arrays");
          const releases = pages.flat();

          function pickDownloadAsset(assets) {
            const normalizedAssets = Array.isArray(assets) ? assets : [];
            const MIN_APK_BYTES = 5242880;
            const apkAssets = normalizedAssets.filter((asset) =>
              String(asset?.name || "").toLowerCase().endsWith(".apk")
            );
            const eligibleApk = apkAssets.find(
              (asset) => (Number(asset?.size) || 0) >= MIN_APK_BYTES
            );
            return eligibleApk || null;
          }

          function simplifyRelease(release, channelLabel) {
            if (!release) {
              return null;
            }

            const asset = pickDownloadAsset(release.assets);
            const normalizedAssets = Array.isArray(release.assets) ? release.assets : [];
            const totalDownloadCount = normalizedAssets.reduce(
              (sum, item) => sum + (Number(item?.download_count || 0) || 0),
              0
            );
            const versionSource = String(release.tag_name || release.name || "").trim();

            return {
              channelLabel: release.prerelease ? "预发布" : channelLabel,
              version: versionSource.replace(/^v/i, ""),
              title: String(release.name || release.tag_name || "最新版本"),
              publishedAt: release.published_at || release.updated_at || "",
              body: String(release.body || ""),
              releaseUrl: String(release.html_url || ""),
              downloadUrl: String(asset?.browser_download_url || release.html_url || ""),
              assetName: String(asset?.name || ""),
              assetCount: normalizedAssets.length,
              assetDownloadCount:
                Number(asset?.download_count || 0) || totalDownloadCount,
            };
          }

          function cleanReleaseLine(line) {
            return String(line || "")
              .replace(/^[-*+]\s+/, "")
              .replace(/^#{1,6}\s+/, "")
              .replace(/`([^`]+)`/g, "$1")
              .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
              .replace(/\*\*([^*]+)\*\*/g, "$1")
              .replace(/__([^_]+)__/g, "$1")
              .trim();
          }

          function extractLatestVersionSection(rawBody) {
            const body = String(rawBody || "");
            const sections = body.split(/^#{2,}\s*v[\d.]+.*$/im);
            if (sections.length > 1) {
              const lastSection = sections[sections.length - 1].trim();
              if (lastSection) {
                return lastSection;
              }
            }
            return body;
          }

          function normalizeChangeType(raw) {
            const heading = String(raw || "").trim();
            if (/新增|feature|new/i.test(heading)) return "新增";
            if (/修复|fix/i.test(heading)) return "修复";
            if (/测试|test/i.test(heading)) return "测试";
            if (/移除|删除|remove/i.test(heading)) return "移除";
            if (/调整|change|adjust/i.test(heading)) return "调整";
            return "优化";
          }

          // 从条目文本自身的开头类型词推断类型（如「新增…」「修复…」）。
          // 只匹配行首，避免命中正文中间出现的「新增」等词。
          function detectLeadingChangeType(text) {
            const normalized = String(text || "").trimStart();
            if (/^新增/.test(normalized)) return "新增";
            if (/^(修复|修正)/.test(normalized)) return "修复";
            if (/^测试/.test(normalized)) return "测试";
            if (/^(移除|删除)/.test(normalized)) return "移除";
            if (/^调整/.test(normalized)) return "调整";
            if (/^优化/.test(normalized)) return "优化";
            return null;
          }

          function extractHighlights(body, limit) {
            const latestSection = extractLatestVersionSection(body);
            const lines = latestSection.split(/\r?\n/);
            const highlights = [];
            let currentType = "更新";

            for (const rawLine of lines) {
              const line = rawLine.trim();
              if (!line || line === "---") {
                continue;
              }

              const headingMatch = line.match(/^#{2,6}\s+(.+)$/);
              if (headingMatch) {
                currentType = normalizeChangeType(headingMatch[1]);
                continue;
              }

              if (/^[-*+]\s+/.test(line)) {
                const text = cleanReleaseLine(line);
                if (text) {
                  // 优先看条目文本开头的类型词；无标题的正文才不会
                  // 全部误落到默认「优化」，产生「[优化] 新增…」这类错配。
                  const leadingType = detectLeadingChangeType(text);
                  // 新版按 `## 新增` 分组、条目本身不带类型词；旧版的扁平列表
                  // 带「新增 」前缀。分组页面里再重复一遍类型词会很难看，这里
                  // 统一把前缀剥掉，类型仍然由 type 字段承载。
                  const stripped = leadingType
                    ? text.replace(/^(新增功能|新增|增加|优化|改进|改善|修复|修正|移除|删除|下线)\s*/, "")
                    : text;
                  highlights.push({
                    type: leadingType || normalizeChangeType(currentType),
                    text: stripped || text,
                  });
                }
              }
            }

            // 完整保存每个版本的全部条目：官网上要逐条展示，不能在这里截断。
            // 只有「首页卡片 / 摘要预览」这类场景才限量，且由调用方显式传 limit。
            return typeof limit === "number" && limit > 0 ? highlights.slice(0, limit) : highlights;
          }

          // 发布说明顶部的「本次重点」行：`> 本次重点：A、B、C`（允许加粗）。
          // 这是作者明确声明的重点；没有时由 keyPoints 的调用方回退到前几条新增。
          function extractKeyPoints(body) {
            const latestSection = extractLatestVersionSection(body);
            for (const rawLine of latestSection.split(/\r?\n/)) {
              const line = rawLine.trim().replace(/\*\*/g, "");
              const match = line.match(/^>\s*本次重点\s*[:：]\s*(.+)$/);
              if (!match) {
                continue;
              }
              return match[1]
                .split(/[、,，;；|]/)
                .map((item) => item.trim())
                .filter(Boolean)
                .slice(0, 3);
            }
            return [];
          }

          function buildKeyPoints(body) {
            const declared = extractKeyPoints(body);
            if (declared.length) {
              return declared;
            }
            const entries = extractHighlights(body);
            const preferred = entries.filter((item) => item.type === "新增");
            const source = preferred.length ? preferred : entries;
            return source.slice(0, 3).map((item) => item.text);
          }

          function buildDescription(body) {
            const keyPoints = buildKeyPoints(body);
            if (keyPoints.length) {
              const preview = keyPoints.join(" · ");
              return preview.length > 180 ? `${preview.slice(0, 180).trim()}…` : preview;
            }
            return "查看 Release 页面了解更多更新内容。";
          }

          // 仓库里的 docs/releases/vX.md 与 Release 正文同源。优先用本地文件：
          // 历史版本后来补写过「本次重点」摘要行，API 正文里没有；用本地文件能
          // 让官网、App 内历史页与发布说明看到同一份重点。文件不在时退回 API 正文。
          function releaseNotesBody(release, version) {
            const raw = String(version || "").replace(/^v/i, "");
            if (raw) {
              try {
                return fs.readFileSync(`docs/releases/v${raw}.md`, "utf8");
              } catch {
                // 老版本或还没入库的版本：用 API 正文
              }
            }
            return String(release.body || "");
          }

          function simplifyFeedRelease(release) {
            if (!release) {
              return null;
            }

            const simplified = simplifyRelease(release, release.prerelease ? "预发布" : "正式版");
            const body = releaseNotesBody(release, simplified.version);
            return {
              channelLabel: simplified.channelLabel,
              version: simplified.version,
              title: simplified.title,
              prerelease: release.prerelease === true,
              publishedAt: simplified.publishedAt,
              description: buildDescription(body),
              keyPoints: buildKeyPoints(body),
              highlights: extractHighlights(body),
              releaseUrl: simplified.releaseUrl,
              downloadUrl: simplified.downloadUrl,
              assetName: simplified.assetName,
            };
          }

          const published = Array.isArray(releases)
            ? releases.filter((release) => !release?.draft && pickDownloadAsset(release?.assets))
            : [];
          const stable = published.find((release) => release?.prerelease !== true) || published[0] || null;
          const prerelease = published.find((release) => release?.prerelease === true) || null;

          const payload = {
            releaseCount: published.length,
            stable: simplifyRelease(stable, "正式版"),
            prerelease: simplifyRelease(prerelease, "预发布"),
          };

          fs.writeFileSync(
            "docs/releases/latest.json",
            `${JSON.stringify(payload, null, 2)}\n`
          );

          const feed = {
            generatedAt: new Date().toISOString(),
            releaseCount: published.length,
            releases: published.slice(0, 8).map(simplifyFeedRelease).filter(Boolean),
          };

          fs.writeFileSync(
            "docs/releases/feed.json",
            `${JSON.stringify(feed, null, 2)}\n`
          );
          EOF

      - name: Build crawlable docs pages and sitemap
        run: python tool/build_docs_seo.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.event.repository.default_branch }}
          commit_message: "chore(docs): auto-update releases json and SEO pages"
          file_pattern: docs/releases/latest.json docs/releases/feed.json docs/schools.html docs/sitemap.xml docs/*.html docs/releases/index.html docs/releases/v*.html tool/build_docs_seo.py
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
