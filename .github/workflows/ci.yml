name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify pubspec encoding
        shell: bash
        run: |
          set -euo pipefail
          if head -c 3 pubspec.yaml | od -An -tx1 | grep -q 'ef bb bf'; then
            echo "ERROR: pubspec.yaml has UTF-8 BOM"
            exit 1
          fi
          python3 - <<'PY'
          import sys
          text = open("pubspec.yaml", encoding="utf-8").read()
          for key in ("version:", "description:"):
              line = next((l for l in text.splitlines() if l.startswith(key)), None)
              if line is None:
                  print(f"ERROR: missing {key} line in pubspec.yaml", file=sys.stderr)
                  sys.exit(1)
              value = line.split(":", 1)[1].strip()
              if not value:
                  print(f"ERROR: empty value for {key} in pubspec.yaml", file=sys.stderr)
                  sys.exit(1)
          print("pubspec.yaml encoding OK")
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
