name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and Test (Flutter ${{ matrix.flutter_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter_version:
          - '3.44.2'
          - '3.44.8'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          cache: true

      - name: Record toolchain
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify pubspec encoding
        shell: bash
        run: |
          set -euo pipefail
          if head -c 3 pubspec.yaml | od -An -tx1 | grep -q 'ef bb bf'; then
            echo "ERROR: pubspec.yaml has UTF-8 BOM"
            exit 1
          fi
          python3 - <<'PY'
          import sys
          text = open("pubspec.yaml", encoding="utf-8").read()
          for key in ("version:", "description:"):
              line = next((l for l in text.splitlines() if l.startswith(key) and not l[0:1].isspace()), None)
              if line is None:
                  print(f"ERROR: missing {key} line in pubspec.yaml", file=sys.stderr)
                  sys.exit(1)
              value = line.split(":", 1)[1].strip()
              if not value:
                  print(f"ERROR: empty value for {key} in pubspec.yaml", file=sys.stderr)
                  sys.exit(1)
          print("pubspec.yaml encoding OK")
          PY

      - name: Verify GitHub Actions pin SHAs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/verify_action_pins.sh

      - name: Install HyperOS audit dependencies
        run: pip install pyyaml

      - name: HyperOS page compliance audit
        run: python tool/hyperos_audit.py --strict

      - name: CJK hardcode audit
        run: python3 tool/audit_cjk_hardcode.py --baseline tool/cjk_hardcode_baseline.txt

      - name: Lint ratchet (discarded_futures / cascade_invocations)
        # 这两条 lint 因存量太多（2026-10-27 实测 238 / 510）故意没开在主配置里，
        # 否则 --fatal-infos 会让全仓红、谁都提交不了。本步骤临时打开它们、
        # 数一遍、与基线比对，保证**只降不升**。脚本动 analysis_options.yaml 之前
        # 会先确认它干净；CI 是全新 checkout，天然安全。
        run: python tool/audit_lint_ratchet.py

      - name: Analyze
        # --fatal-infos：info 级问题也视为失败（analysis_options.yaml 已启用
        # strict-casts/strict-raw-types 与扩展 lint 集，需严格门禁防劣化）。
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # JVM 单测（android/app/src/test）：WidgetStatsLogicTest 等。
      # 这些测试不依赖 org.json stub（见 WidgetHolidayLogicTest 注释），
      # 但 Gradle 要先跑 flutter 的 gradle 脚本生成任务图，耗时较长，与
      # flutter test 并行意义不大，放最后串行执行。
      - name: Android JVM unit tests
        run: |
          cd android
          ./gradlew :app:testProdDebugUnitTest --stacktrace --quiet

      # Compose 渲染层编译（2026-10-27 补）：`prod` 变体**不含** compose 源集，
      # 上面那条 `testProdDebugUnitTest` 编译不到 `src/composeP1/kotlin`——迁移中的
      # Compose 页面此前既不被 CI 编译、也不被 CI 测试（台账 §7.1 记录的覆盖盲区）。
      # 只做编译（不打包、不签名、不跑测试）：编 `sourceSets.composeUi` 里**已挂载**的
      # 渲染层目录，挂上 = 该批渲染层开始受 CI 保护（挂载清单见 android/app/build.gradle）。
      # 注意：composeP1 变体在页面迁移期**故意不编**（它指向整棵 pages/，必然带出在途欠账），
      # 所以这里不包含 compileComposeP1DebugKotlin。
      - name: Compose 渲染层编译（composeUi 已挂载页面）
        run: |
          cd android
          ./gradlew :app:compileComposeUiDebugKotlin --stacktrace --quiet
