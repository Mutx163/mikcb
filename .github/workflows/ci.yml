name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # 去 Flutter 化 P4-D（2026-11-07）：Dart 层已删除，只留 Android/JVM 这一条链。
    # 原矩阵里的两个 Flutter 版本、flutter pub get / analyze / test，以及
    # HyperOS 审计、CJK 硬编码审计、lint 棘轮三项，输入（lib/、pubspec）都已不存在，
    # 全部撤除；版本号改成校验 android/version.properties。
    name: Android JVM Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # crossguard 依赖（2026-11-12）：JVM 单测里的 CrossDomainGateGuardTest 会**真的**以
      # 子进程调用 `pwsh scripts/compose-style-lint.ps1` 与 `python3 scripts/i18n-copy-gap.py`。
      # ubuntu-latest 预装但版本随镜像漂移：缺工具/版本不对必须在这里 fail-fast，
      # 否则会表现成「样式/文案门禁失败」，把"环境缺工具"误读成"代码有问题"。
      - name: Pin crossguard toolchain (pwsh 7 + python 3)
        shell: bash
        run: |
          set -euo pipefail
          PWSH_PIN=7.4.6
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh 缺失，安装钉版 ${PWSH_PIN}…"
            curl -fsSL --retry 3 "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_PIN}/powershell-${PWSH_PIN}-linux-x64.tar.gz" -o /tmp/pwsh.tgz
            sudo mkdir -p /opt/microsoft/powershell/7
            sudo tar -xzf /tmp/pwsh.tgz -C /opt/microsoft/powershell/7
            sudo chmod +x /opt/microsoft/powershell/7/pwsh
            sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 缺失，安装…"
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3
          fi
          pwsh -v
          python3 -V
          pwsh -v | grep -q "^PowerShell 7\." || { echo "ERROR: 需要 PowerShell 7.x（crossguard 脚本依赖）"; exit 1; }
          python3 -c 'import sys; sys.exit(0 if sys.version_info[:2] >= (3, 11) else 1)' \
            || { echo "ERROR: 需要 Python >= 3.11（i18n-copy-gap 依赖）"; exit 1; }

      - name: Verify version.properties
        shell: bash
        run: |
          set -euo pipefail
          f=android/version.properties
          if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
            echo "ERROR: $f 带 UTF-8 BOM"; exit 1
          fi
          bash tool/verify_release_version.sh "$f"

      - name: Verify GitHub Actions pin SHAs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/verify_action_pins.sh

      # JVM 单测（android/app/src/test）：WidgetStatsLogicTest 等。
      # Flutter Gradle 插件已移除，这条链不再需要 Flutter SDK。
      - name: Android JVM unit tests
        run: |
          cd android
          ./gradlew :app:testProdDebugUnitTest --stacktrace --quiet --no-daemon
