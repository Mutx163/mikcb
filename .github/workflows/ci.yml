name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and Test (Flutter ${{ matrix.flutter_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter_version:
          - '3.44.2'
          - '3.44.8'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          cache: true

      - name: Record toolchain
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify pubspec encoding
        shell: bash
        run: |
          set -euo pipefail
          if head -c 3 pubspec.yaml | od -An -tx1 | grep -q 'ef bb bf'; then
            echo "ERROR: pubspec.yaml has UTF-8 BOM"
            exit 1
          fi
          python3 - <<'PY'
          import sys
          text = open("pubspec.yaml", encoding="utf-8").read()
          for key in ("version:", "description:"):
              line = next((l for l in text.splitlines() if l.startswith(key) and not l[0:1].isspace()), None)
              if line is None:
                  print(f"ERROR: missing {key} line in pubspec.yaml", file=sys.stderr)
                  sys.exit(1)
              value = line.split(":", 1)[1].strip()
              if not value:
                  print(f"ERROR: empty value for {key} in pubspec.yaml", file=sys.stderr)
                  sys.exit(1)
          print("pubspec.yaml encoding OK")
          PY

      - name: Verify GitHub Actions pin SHAs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/verify_action_pins.sh

      - name: Install HyperOS audit dependencies
        run: pip install pyyaml

      - name: HyperOS page compliance audit
        run: python tool/hyperos_audit.py --strict

      - name: CJK hardcode audit
        run: python3 tool/audit_cjk_hardcode.py --baseline tool/cjk_hardcode_baseline.txt

      - name: Analyze
        # --fatal-infos：info 级问题也视为失败（analysis_options.yaml 已启用
        # strict-casts/strict-raw-types 与扩展 lint 集，需严格门禁防劣化）。
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
