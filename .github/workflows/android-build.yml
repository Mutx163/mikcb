name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        id: meta
        shell: bash
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${RELEASE_TAG#v}"
          RELEASE_NOTES_FILE="docs/releases/v${VERSION_NAME}.md"
          if [[ "${APP_VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_notes_file=${RELEASE_NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Prepare signing files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Missing Android signing secrets."
            exit 1
          fi
          mkdir -p android/app
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OVERRIDE_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: flutter build apk --release --split-per-abi

      - name: Prepare artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          VERSION_NAME="${{ steps.meta.outputs.version_name }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"

      - name: Sync system time
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ntpdate > /dev/null 2>&1
          sudo ntpdate -u ntp.aliyun.com || sudo ntpdate -u pool.ntp.org || true
          date

      - name: Upload to pgyer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${PGYER_API_KEY}" ]]; then
            echo "PGYER_API_KEY not set, skipping upload."
            exit 0
          fi
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          [[ ! -f "${APK}" ]] && { echo "APK not found"; exit 1; }

          echo "Step 1: getCOSToken"
          TOKEN=$(curl -s --connect-timeout 10 --max-time 30 -X POST \
            --form-string "_api_key=${PGYER_API_KEY}" \
            --form-string "buildType=apk" \
            https://www.pgyer.com/apiv2/app/getCOSToken)
          echo "${TOKEN}"
          CODE=$(echo "${TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['code'])")
          [[ "${CODE}" != "0" ]] && { echo "getToken failed"; exit 1; }

          ENDPOINT=$(echo "${TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['endpoint'])")
          KEY=$(echo "${TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['params']['key'])")
          SIG=$(echo "${TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['params']['signature'])")
          COS_TOKEN=$(echo "${TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['params']['x-cos-security-token'])")
          BUILD_KEY=$(echo "${TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['key'])")

          echo "Step 2: upload to COS"
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 30 --max-time 600 -X POST \
            --form-string "key=${KEY}" \
            --form-string "signature=${SIG}" \
            --form-string "x-cos-security-token=${COS_TOKEN}" \
            -F "file=@${APK}" \
            "${ENDPOINT}")
          echo "HTTP: ${HTTP}"
          [[ "${HTTP}" != "204" ]] && { echo "Upload failed"; exit 1; }

          echo "Step 3: poll buildInfo"
          for i in $(seq 1 60); do
            sleep 5
            INFO=$(curl -s "https://www.pgyer.com/apiv2/app/buildInfo?_api_key=${PGYER_API_KEY}&buildKey=${BUILD_KEY}")
            IC=$(echo "${INFO}" | python3 -c "import sys,json;print(json.load(sys.stdin)['code'])")
            if [[ "${IC}" == "0" ]]; then
              URL=$(echo "${INFO}" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['buildShortcutUrl'])")
              echo "Done! https://www.pgyer.com/${URL}"
              exit 0
            elif [[ "${IC}" == "1247" ]]; then
              echo "Processing... ${i}/60"
            else
              echo "Error: ${INFO}"; exit 1
            fi
          done
          echo "Timeout"; exit 1

      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/mikcb-*.apk

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.release_notes_file }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          RELEASE_APK="dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"
          if [[ -f "${RELEASE_NOTES_FILE}" ]]; then
            RELEASE_NOTES_OPTION=(--notes-file "${RELEASE_NOTES_FILE}")
          else
            RELEASE_NOTES_OPTION=(--notes "Automated release for ${RELEASE_TAG}")
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            PRERELEASE_OPTION=(--prerelease)
          else
            PRERELEASE_OPTION=()
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${RELEASE_APK}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" "${PRERELEASE_OPTION[@]}" "${RELEASE_NOTES_OPTION[@]}"
          else
            gh release create "${RELEASE_TAG}" "${RELEASE_APK}" \
              --title "${RELEASE_TAG}" \
              "${PRERELEASE_OPTION[@]}" \
              "${RELEASE_NOTES_OPTION[@]}" \
              --target "${GITHUB_SHA}"
          fi
