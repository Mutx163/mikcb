name: Android Build

on:
  push:
    tags:
      - 'v*'
  # 手动触发跑在分支上（GITHUB_REF_NAME 是分支名，不是标签），版本闸没法从 ref 推断
  # 该对哪个版本打包，所以必须能显式给版本号；留空则退回按 ref 推断（见 Release
  # metadata 步骤）。
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验/发布的版本号（不带 v，如 3.0.0-1）；留空按当前 ref 推断'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_STABLE_VERSION: '3.44.8'

jobs:
  check:
    name: Analyze and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 复用 ci.yml 的绿灯需要读本仓 Actions 运行记录

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 发版提速（2026-10-18）：tag 与 main 指向同一个 commit 时，ci.yml 已经把
      # analyze / test / 编码 / CJK / HyperOS / JVM 单测全跑过一遍（是下面检查项的
      # 超集）。同一 SHA 的绿灯直接复用，省掉这次重复的 7～8 分钟；查不到绿灯
      # （没推 main、CI 还在跑、刚失败）就照常跑完整检查，一步不少。
      #
      # 去 Flutter 化 P4-D（2026-11-07）：Dart 层已删除，ci.yml 只剩 Android/JVM
      # 单测这一条链且**阻塞**（没有 continue-on-error）。同一 SHA 的 ci 绿 = JVM
      # 单测通过，复用是安全的；检查项见下方 Unit tests (JVM)。
      - name: Reuse green CI for this commit
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          green=$(gh run list --workflow=ci.yml --commit "${GITHUB_SHA}" --event push \
            --limit 10 --json headBranch,conclusion \
            --jq '[.[] | select(.headBranch == "main" and .conclusion == "success")] | length' \
            || echo 0)
          if [ "${green}" -gt 0 ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${GITHUB_SHA} 在 main 上已有全绿 CI，跳过重复的 JVM 单测"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 没有可复用的绿灯，照常执行 JVM 单测"
          fi

      # 无论是否复用都要现查：tag 与版本号是否配套、发版说明在不在。
      # 这几项只要几秒，却是「tag 打错版本 / 忘写 notes」的最后一道闸。
      # 去 Flutter 化 P4-D：版本源已从 pubspec.yaml 换到 android/version.properties。
      - name: Release metadata (fast)
        shell: bash
        env:
          # 手动触发时由 inputs.tag 显式给版本号；tag 推送时该值为空，退回按 ref 推断。
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # tag 推送：GITHUB_REF_NAME = "v3.0.0-1"；手动触发（workflow_dispatch）：
          # GITHUB_REF_NAME 是分支名 —— 直接 #v 会得到分支名，版本闸必红。所以优先用
          # inputs.tag，两边都容忍带不带前导 v。
          tag="${INPUT_TAG:-${GITHUB_REF_NAME#v}}"
          tag="${tag#v}"
          notes="docs/releases/v${tag}.md"
          bytes=$(head -c 3 android/version.properties | od -An -tx1 | tr -d ' \n')
          if [ "${bytes}" = "efbbbf" ]; then
            echo "ERROR: android/version.properties 带 UTF-8 BOM"; exit 1
          fi
          version=$(sed -n 's/^versionName=//p' android/version.properties | tr -d '\r')
          expected=$(printf '%s' "${version}" | awk -F'+' '{print $1}' | sed -E 's/-0$//; s/-([0-9]+)$/.\1/')
          if [ "${expected}" != "${tag}" ]; then
            echo "ERROR: tag ${tag} 与 android/version.properties 的 ${version} 不配套（按版本应打 v${expected}）"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -z "${INPUT_TAG}" ]; then
              echo "手动触发请在 inputs.tag 填版本号（不带 v，例如 ${expected}）" >&2
            fi
            exit 1
          fi
          if [ ! -s "${notes}" ]; then
            echo "ERROR: 缺少发版说明 ${notes}"; exit 1
          fi
          head_line=$(awk 'NF{print; exit}' "${notes}" | tr -d '\r')
          if [ "${head_line}" != "# v${tag}" ]; then
            echo "ERROR: ${notes} 首行是 '${head_line}'，应为 '# v${tag}'"; exit 1
          fi
          if ! grep -q '^> 本次重点' "${notes}"; then
            echo "::warning file=${notes}::没有「> 本次重点」行，更新弹窗会退化成按分类优先级猜前 3 条"
          fi
          echo "release metadata OK: v${tag}"

      - name: Set up Java 21
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # 去 Flutter 化 P4-D：Dart 层已删除，检查项换成 Kotlin/JVM 单测（Gradle）。
      # 复用绿灯时跳过，与原先 analyze 的口径一致。
      # 变体口径：CI / 发布链一律 prod（与 ci.yml、.cnb.yml 同一条命令）；本地 L2 可以用
      # dev（scripts/safe-gradle.ps1 默认 :app:testDevDebugUnitTest），两者跑同一份 src/test。
      - name: Unit tests (JVM)
        if: steps.reuse.outputs.reuse != 'true'
        run: cd android && ./gradlew :app:testProdDebugUnitTest --no-daemon

  publish:
    name: Build and Publish Android APK
    needs: check
    # 只对真标签发布：手动触发（workflow_dispatch）跑的是分支 ref，这里会跳过，
    # 等于只跑 check 那套校验。要真发版仍然打 v* 标签。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MIN_APK_BYTES: 5242880
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      release_notes: ${{ steps.meta.outputs.release_notes }}
      gitcode_body: ${{ steps.gitcode_body.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # 去 Flutter 化 P4-D（2026-11-07）：Dart 层已删除，出包不再需要 Flutter SDK——
      # 原先的 Set up Flutter / Record toolchain / Get dependencies 三步一并移除。

      - name: Read app version
        id: meta
        shell: bash
        run: |
          # 去 Flutter 化 P4：版本号唯一事实源从 pubspec.yaml 换成 android/version.properties。
          APP_VERSION=$(grep '^versionName=' android/version.properties | cut -d= -f2-)
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${RELEASE_TAG#v}"
          RELEASE_NOTES_FILE="docs/releases/v${VERSION_NAME}.md"
          if [[ "${APP_VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_notes_file=${RELEASE_NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          # 读取 release notes 内容用于蒲公英更新说明
          if [[ -f "${RELEASE_NOTES_FILE}" ]]; then
            # 提取以 - 开头的行，去掉前缀
            RELEASE_BODY=$(grep "^- " "${RELEASE_NOTES_FILE}" | sed 's/^- //')
            echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
            echo "${RELEASE_BODY}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            # 读取完整 release notes 用于 GitCode Release 正文
            echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
            cat "${RELEASE_NOTES_FILE}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "release_body=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            echo "release_notes=Automated release for ${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Missing Android signing secrets."
            exit 1
          fi
          mkdir -p android/app
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks

      - name: Restore Gradle cache
        # 只读不写：tag ref 写入的缓存对后续所有 tag 不可见（缓存按 ref 隔离），
        # 历史上 4 次写入 0 次命中；写入由 main 分支的 gradle-cache-warm.yml 负责，
        # 本步骤经「默认分支缓存对所有 ref 可见」规则命中预热结果
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 去 Flutter 化阶段 2 · P2：出包改走 Gradle 原生任务，不再经 `flutter build apk`。
      # ARM64 由 `app/build.gradle` 的 `abiFilters` 限定，不需要再传 `--target-platform`；
      # `OVERRIDE_VERSION_NAME` 仍由 `app/build.gradle` 读环境变量，语义不变。
      # Flutter 的 Dart 资源链此刻仍由 Flutter Gradle 插件挂在 assemble 上（withFlutter=true），
      # 等 P4 删掉 lib/ 之后这条链才会彻底断开。
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OVERRIDE_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: cd android && ./gradlew :app:assembleProdRelease --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          set -ex
          mkdir -p dist
          VERSION_NAME="${{ steps.meta.outputs.version_name }}"
          echo "=== Build output tree ==="
          find build/app/outputs -type f 2>/dev/null | head -30
          echo "=== APK files (size) ==="
          find build/app/outputs -name '*.apk' -type f -exec ls -lh {} \; 2>/dev/null || echo 'No APK files found'

          APK_PATH=""
          CANDIDATES=(
            "build/app/outputs/flutter-apk/app-prod-release.apk"
            "build/app/outputs/apk/prod/release/app-prod-release.apk"
          )
          for candidate in "${CANDIDATES[@]}"; do
            if [[ -f "${candidate}" ]]; then
              APK_PATH="${candidate}"
              echo "Using explicit APK path: ${APK_PATH}"
              break
            fi
          done

          if [[ -z "${APK_PATH}" ]]; then
            echo "WARN: explicit APK paths not found, selecting largest eligible *.apk..."
            APK_PATH=$(
              find build/app/outputs -name '*.apk' -type f \
                ! -iname '*debug*' \
                ! -iname '*unsigned*' \
                -printf '%s %p\n' 2>/dev/null \
              | sort -n \
              | tail -1 \
              | cut -d' ' -f2-
            )
          fi

          if [[ -z "${APK_PATH}" || ! -f "${APK_PATH}" ]]; then
            echo "ERROR: Could not find any release APK under build/app/outputs"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${APK_PATH}")
          echo "Found APK: ${APK_PATH} (${APK_SIZE} bytes)"
          ls -lh "${APK_PATH}"

          if [[ "${APK_SIZE}" -lt "${MIN_APK_BYTES}" ]]; then
            echo "ERROR: APK is too small (${APK_SIZE} bytes < ${MIN_APK_BYTES} bytes). Likely not a real release build."
            exit 1
          fi

          if command -v file >/dev/null 2>&1; then
            FILE_TYPE=$(file -b "${APK_PATH}")
            echo "file(1) reports: ${FILE_TYPE}"
            if ! echo "${FILE_TYPE}" | grep -qiE 'zip|android|apk|archive'; then
              echo "ERROR: file(1) does not recognize APK as ZIP/archive: ${FILE_TYPE}"
              exit 1
            fi
          else
            echo "WARN: file(1) not available, skipping archive type check"
          fi

          cp "${APK_PATH}" "dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"
          ls -lh "dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"

      - name: Compute APK checksum and GitCode release body
        id: gitcode_body
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.release_notes_file }}
        run: |
          set -ex
          RELEASE_APK="dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"
          SHA256=$(sha256sum "${RELEASE_APK}" | awk '{print $1}')
          BODY_FILE="$(mktemp)"
          if [[ -f "${RELEASE_NOTES_FILE}" ]]; then
            cat "${RELEASE_NOTES_FILE}" >> "${BODY_FILE}"
          else
            echo "Automated release for ${RELEASE_TAG}" >> "${BODY_FILE}"
          fi
          # 应用内 GitCode 渠道的完整性校验依赖正文内嵌摘要（GitCode 无 asset digest）
          {
            echo ""
            echo "---"
            echo "SHA-256: ${SHA256}"
          } >> "${BODY_FILE}"
          {
            echo "body<<EOF"
            cat "${BODY_FILE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to pgyer
        # Secondary mirror only; network blips must not block GitHub Release.
        continue-on-error: true
        uses: PGYER/pgyer-upload-app-action@cb188f519024da5bf61d6a128923247898dd6999 # v1.3
        with:
          _api_key: ${{ secrets.PGYER_API_KEY }}
          appFilePath: dist/mikcb-${{ steps.meta.outputs.version_name }}-arm64-v8a.apk
          buildInstallType: 1
          buildUpdateDescription: ${{ steps.meta.outputs.release_body }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-apk
          path: dist/mikcb-*.apk

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.release_notes_file }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          set -ex
          # MIN_APK_BYTES is defined at job level env
          RELEASE_APK="dist/mikcb-${VERSION_NAME}-arm64-v8a.apk"
          if [[ ! -f "${RELEASE_APK}" ]]; then
            echo "ERROR: Release APK not found at ${RELEASE_APK}"
            exit 1
          fi
          RELEASE_APK_SIZE=$(stat -c%s "${RELEASE_APK}")
          echo "Release APK size: ${RELEASE_APK_SIZE} bytes"
          ls -lh "${RELEASE_APK}"
          if [[ "${RELEASE_APK_SIZE}" -lt "${MIN_APK_BYTES}" ]]; then
            echo "ERROR: Refusing gh release upload (${RELEASE_APK_SIZE} bytes < ${MIN_APK_BYTES} bytes)."
            exit 1
          fi
          if [[ -f "${RELEASE_NOTES_FILE}" ]]; then
            RELEASE_NOTES_OPTION=(--notes-file "${RELEASE_NOTES_FILE}")
          else
            RELEASE_NOTES_OPTION=(--notes "Automated release for ${RELEASE_TAG}")
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            PRERELEASE_OPTION=(--prerelease)
          else
            PRERELEASE_OPTION=()
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${RELEASE_APK}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" "${PRERELEASE_OPTION[@]}" "${RELEASE_NOTES_OPTION[@]}"
          else
            # 不传 --target：tag 先于 CI 存在，该参数冗余；2026-09 起 GitHub 对
            # integration 携带 target_commitish 的 release 创建一律 403
            gh release create "${RELEASE_TAG}" "${RELEASE_APK}" \
              --title "${RELEASE_TAG}" \
              "${PRERELEASE_OPTION[@]}" \
              "${RELEASE_NOTES_OPTION[@]}"
          fi

  sync-releases-json:
    name: Sync releases JSON to docs
    needs: publish
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Update Docs Releases JSON workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-docs-releases.yml',
              ref: 'main',
            });

  gitcode-push:
    name: Sync code to GitCode
    # 国内下载加速：把 main 分支与全部 tag 同步到 GitCode 镜像仓库（nvdacn/sync_to_gitcode 可复用工作流）
    # vars.GITCODE_USERNAME 不存在时整个 Job 跳过，Fork 仓库未配置也不会失败
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.GITCODE_USERNAME }}
    needs: publish
    permissions:
      contents: read
    uses: nvdacn/sync_to_gitcode/.github/workflows/PushToGitCode.yaml@18b70112d0e62260bc54085028e5510bbc6323b2 # sync_to_gitcode@master
    with:
      default_branch: main
      gitcode_username: ${{ vars.GITCODE_USERNAME }}
    secrets:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

  gitcode-release:
    name: Sync release to GitCode
    # 把本次构建的 APK 作为 Release 附件同步到 GitCode，正文使用完整 release notes
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.GITCODE_USERNAME }}
    needs: [publish, gitcode-push]
    permissions:
      actions: read
    uses: nvdacn/sync_to_gitcode/.github/workflows/CreateReleaseOnGitCode.yaml@18b70112d0e62260bc54085028e5510bbc6323b2 # sync_to_gitcode@master
    with:
      artifact_name: android-release-apk
      default_branch: main
      tag_name: ${{ needs.publish.outputs.release_tag }}
      body: ${{ needs.publish.outputs.gitcode_body }}
      prerelease: ${{ needs.publish.outputs.is_prerelease == 'true' }}
      file_name: 'mikcb-*.apk'
    secrets:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
