name: Update Contributor Avatars

on:
  schedule:
    # 每周一 10:40（北京时间），与 docs 数据任务错开
    - cron: "40 2 * * 1"
  workflow_dispatch:

concurrency:
  # 与 schools / releases 数据任务同组串行，避免同时往 main 推提交。
  group: docs-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # 同 update-docs-releases.yml：main 要求走 PR，配了 DOCS_PUSH_TOKEN
          # 就以其身份推送（管理员可直推）。
          token: ${{ secrets.DOCS_PUSH_TOKEN != '' && secrets.DOCS_PUSH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Generate contributor walls
        env:
          # 提升 API 限额；只调公开接口，token 不出本步。
          GITHUB_TOKEN: ${{ github.token }}
        run: python tool/generate_contributors.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          commit_message: "chore(docs): auto-update contributor avatars"
          file_pattern: README.md docs/contributors/*.svg
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
