name: university_timetable
description: 轻屿课表应用 - 支持小米超级岛
publish_to: 'none'
version: 2.0.0-0+110

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.2.1
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  http: ^1.2.2
  package_info_plus: ^8.0.2
  share_plus: ^10.1.2
  crypto: ^3.0.6
  webdav_plus: ^1.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_markdown: ^0.7.7+1
  flutter_secure_storage: ^9.2.4
  webview_flutter: 4.11.0
  azlistview: ^2.0.0
  animations: ^2.0.11
  flex_color_picker: ^3.7.0
  table_parser: ^1.0.1
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  forui: ^0.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/donate/
    - assets/holidays/
    - docs/releases/
    - assets/lan_edit/
    - assets/lan_edit/vendor/
    - assets/templates/
