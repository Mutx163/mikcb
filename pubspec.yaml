  flutter: ">=3.44.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.6.0
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  http: ^1.2.2
  package_info_plus: ^8.0.2
  share_plus: ^12.0.2
  crypto: ^3.0.6
  webdav_plus: ^1.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_markdown: ^0.7.7+1
  flutter_secure_storage: ^10.3.1
  webview_flutter: 4.14.1
  azlistview: ^2.0.0
  animations: ^2.0.11
  table_parser: ^1.0.1
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  fast_gbk: ^1.0.0
  flutter_svg: ^2.3.0
  image: ^4.8.0
  flutter_miuix:
    git:
      url: https://github.com/Mutx163/flutter_miuix.git
      ref: ef5c1312d7aab00670a2539ff67bc3b88086f795
  liquid_glass_renderer: ^0.2.0-dev.4
  flutter_blackbox: ^0.7.0
  fountain_codes: ^1.0.0
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3

