name: university_timetable
description: 轻屿课表应用 - 支持小米超级岛
publish_to: 'none'
version: 2.1.3-3+138
repository: https://github.com/Mutx163/mikcb
homepage: https://github.com/Mutx163/mikcb
issue_tracker: https://github.com/Mutx163/mikcb/issues
license: GPL-3.0-or-later

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.6.0
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  http: ^1.2.2
  package_info_plus: ^9.0.1
  # 天气「使用当前位置」用。国行设备没装 Google Play Services 时，插件会自己
  # 回退到系统 LocationManager，所以无需 GMS、也不必设 forceLocationManager。
  # 反查地名不走这个包（它不提供），走 BigDataCloud，见 device_location_service.dart。
  #
  # 约束写 ^14.0.0 而不是 ^14.0.3：14.0.3 要求 geolocator_linux ^0.2.6，后者要求
  # package_info_plus ^10.0.0，而本项目锁在 ^9.0.1——升级 package_info_plus 会连带
  # 10.2.0 的 Android Gradle/Kotlin 构建改动，与本功能无关且我这边没法验证构建。
  # 写 ^14.0.0 让 pub 自己回退：实测解析到 geolocator 14.0.2 + geolocator_linux 0.2.4
  # （后者兼容 package_info_plus 9）。将来 package_info_plus 升上去后，这个约束会
  # 自动解析到更新的 geolocator，不必再改。
  geolocator: ^14.0.0
  share_plus: ^12.0.2
  crypto: ^3.0.6
  webdav_plus: ^1.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_markdown: ^0.7.7+1
  flutter_secure_storage: ^10.3.4
  webview_flutter: 4.14.1
  webview_flutter_android: 4.13.0
  azlistview: ^2.0.0
  # 学校列表自建字母条要直接驱动滚动落点（AzListView 内置跳转对齐到视口
  # 顶部，会被悬浮顶栏盖住），此前是 azlistview 的传递依赖，这里转正。
  scrollable_positioned_list: ^0.2.3
  animations: ^2.0.11
  table_parser: ^1.0.1
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  fast_gbk: ^1.0.0
  flutter_svg: ^2.3.0
  image: ^4.8.0
  # 2026-09-13：由 fork（1.0.11 / commit 241bbea）切到上游 pub.dev 版 1.2.0。
  # 依据：fork 的本地补丁已分别并入上游 1.1.0（系统字重与标题字重 API）与
  # 1.1.1（pubspec Git 依赖在中文 Windows 下的编码修复）；1.2.0 的 HyperOS 4
  # 玻璃组件按上游 CHANGELOG 为「可选、与旧组件并存、不改动既有组件默认表现、
  # 原有界面样式零变化」，属纯新增，升级面安全。
  flutter_miuix: ^1.2.0
  flutter_blackbox: ^0.7.0
  fountain_codes: ^1.0.0
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  # 顶栏渐进模糊（Inspire Blur）：自定义 GPU shader 的变量模糊，
  # 用于顶栏玻璃带「上浓下淡」的渐进过渡（见 lib/ui/hyperos/inspire/）。
  inspire_blur: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

# 覆盖：指向 fork 上带注入点补丁的 flutter_miuix（glassy-surface 分支，基于上游 1.2.0）。
# 补丁都是「把面板材质 / 蒙层 / 让位手感让给调用方」的注入点：
#   · 弹层族（popup presenter / 列表弹层等）已有的 `surfaceBuilder`；
#   · 底部弹窗 `MiuixOverlayBottomSheet` / `MiuixWindowBottomSheet` 上的
#     `surfaceBuilder`（child 是真实面板内容）+ `scrimUnderlay`（覆盖层里、压暗蒙层
#     之前的前置层，覆盖层随之进 `BackdropGroup`）+ `dimColor`；
#   · 弹层让位缩放（`stacked`）的手感与几何：`stackDuration` / `stackCurve` 换掉
#     包内那条参数写死的让位弹簧；`stackShrinkFromAnchor` 把支点取到「离锚点最近
#     的那个面板角」（朝锚点方向退让，而不是以面板中心）；`stackPivotBounds` 把
#     支点钉到任意矩形（传一个零尺寸矩形就是「钉到某个点」）；`stackScalesPanel`
#     让让位只缩内容、卡片轮廓原地不动 —— **这条被用户否掉过**（「为什么他妈的
#     卡片没缩，内容缩放了」），当前**无调用方**，留着只为记录那条路走不通。
#   · 二级面板（`MiuixGlassSecondaryPopup`）也开放同一族让位开关：上游只让一级
#     （`MiuixGlassTransformPopup`）参与让位、二级原地不动，两块同宽同边的面板
#     叠在一起时，缩过的那块左边缘会比二级多退 5% 板宽（200 宽上 10px）。
#     2026-09-20 曾用它把两块钉到同一支点一起缩来消这条缝，2026-09-21 用户否掉
#     （二级的行文字跟着小 5%，被点那一行也跟着挪），改回「只有一级缩」，**这条缝
#     由用户拍板接受**。所以二级这一族参数目前在本仓**没有调用方**（留着是因为
#     缺省行为与打补丁前逐字相同，删它要再动一次 pin 的 SHA，收益为零）。
#   · `stackLocksInput` 把让位拆成两件事：**视觉退让** 与 **让出输入**（内容命中 /
#     焦点 / 返回键 / 遮罩关窗）。默认 true = 上游原行为（被压在下面那块连输入一起
#     让出）；只想借让位变换消接缝、输入仍归自己的那块传 false。
#   · 出生即带 `stacked` 的弹层，让位进度直接落在目标值（`initState` 赋初值）——
#     `didUpdateWidget` 只在 `stacked` **变化**时驱动，按需挂载的二级面板挂上那
#     一刻让位就已经成立，不补这一刀会「传了 stacked 却没缩」。
# 课程弹窗（通栏底部弹窗）用它们把面板换成本仓液态玻璃，并让玻璃采到未压暗的页面；
# 用法与理由见 lib/ui/hyperos/miuix_bottom_sheet.dart；首页菜单的让位手感与几何见
# lib/widgets/home_top_menu_popup.dart（一级向右退让、二级不参与让位）。
# **固定到 commit，不要写分支名** —— 分支名会让不同时间 / 不同机器解析到不同的那份，
# CI 也拿不到可复现的依赖。补丁进了上游 release 后整块删掉，即回到 pub.dev。
dependency_overrides:
  flutter_miuix:
    # 包含六个补丁：
    #   1. 让位缩放改为面板布局矩形朝支点缩小，玻璃按缩后尺寸画（paint 变变换
    #      带不动 BackdropFilter，所以缩放必须落在布局矩形上）；
    #   2. 二级面板边缘高光/阴影随开合渐显；
    #   3. 弹层输入与视觉拆开：内容**显影之前不吃点击**（入场那几帧行按钮看不见
    #      却可点，快速连点会点进那一行对应的页面），锚点**收起期第一帧就收回
    #      输入**（原先 contentHidden 连 IgnorePointer 一起给、要等收起动画播完
    #      才复位，整段收起期那颗球点不动，第二次点击被静默丢掉）；
    #   4. 底部弹窗（`MiuixOverlayBottomSheet` / `MiuixWindowBottomSheet`）
    #      **收起一开始就把输入还给底层**：全屏蒙层原要等退场弹簧结算完才移除，
    #      那 500ms 里「关掉弹窗马上点下一节课」的第二下会被它吃掉。
    #   5. 底部弹窗把手**只允许往下拖**：面板高度由内容决定，上面没有可展开的
    #      空间，原先的 0.1 阻尼等于允许面板往上漂，底沿离开屏幕、下面露出
    #      一条压暗蒙层（真机口径「往上拉，拉上去下面变成空白」）。
    #   6. 底部弹窗把手条可**悬浮**在内容之上（`dragHandleOverlaysContent`，默认
    #      假 = 行为不变）：面板顶部原先实打实留了「把手条 24 + 无标题时的空占位
    #      18」= 42，内容从 42 才开始，那 42 背后什么都没有 ——
    #      **画在这截上的顶部渐变模糊永远糊不到东西**（材质面板就卡在这里），顶部
    #      也空一大块。悬浮后内容从面板上沿起、能滚到把手底下，死区归零；把手排在
    #      Stack 末位，命中与绘制都在内容之前，竖向拖动不会被滚动视图抢走。
    #      代价是那 24px 画得到、点不到，调用方自己让开（见
    #      lib/ui/hyperos/miuix_bottom_sheet.dart 的 reserveDragHandleStrip）。
    git:
      url: https://github.com/Mutx163/flutter_miuix.git
      ref: 614bf04249542f0c002ee5d95b057f2bad5dd506
  # inspire_blur：**三个补丁**——
  #   1.（性能）分布图像素记忆化——上游每个新挂载的顶栏都同步重算一张 674k 像素的
  #      分布图（真机实测 36~49ms），这里按 (distribution, size) 记住像素。
  #   2.（形状，2026-09-28）`ProductDistribution`：两个方向渐变的**乘积**。上游每个
  #      分布都是「单一形状」（整带均匀 / 一条方向渐变 / 椭圆 / 圆角矩形 / 自带图），
  #      表达不了「沿一条轴满强度、沿另一条轴在两端淡出」—— 弹窗面板顶部渐变带要的
  #      正是那个：上沿（面板轮廓那条边线）满强度化开，同时在面板两个上角那一段淡到
  #      0，好让面板自己的边光继续把圆角读成圆的。少了它，这一处只能在「角上被压平」
  #      与「上沿读成透明」之间二选一，两条都真机被打回过（2026-09-28 三轮）。
  #      详见 `.agents/notes/implemented/bug-fix/2026-09-28-sheet-top-band-corner-ramp.md`。
  #   3.（修复，2026-09-29）背景模糊着色器的 `u_size`（画布尺寸，float 0/1）上游从未
  #      设置，恒为 (0,0)：采样坐标全部退化，强度图实际只采到**左上角一个点**且恒定
  #      —— 单向渐变分布在那点 = 1（顶栏碰巧接近正确，bug 被衬底掩盖）；乘积分布
  #      在那点 = 1×0 = 0（弹窗顶部渐变带的模糊整条死掉，真机口径「渐变模糊变成
  #      透明的，只剩顶部一层白雾」）。修法：显式设 u_size = 物理屏幕尺寸。
  #   4.（修复，2026-09-29）材料矩形外一律输出透明：引擎对 BackdropFilter 的裁剪
  #      并不总可靠，真机实测模糊效果在有内容滚到带下时越出面板圆角，在角外方形
  #      区域留下亮色填充（「圆角外面会出现东西，顶部/底部又正常」）。着色器用
  #      clamp 前的 areaUV 判定内外，矩形外强制 alpha=0，矩形内逐像素不变。
  #   5.（修复，2026-09-29）顶角圆弧遮罩接线：`InspireBlurConfig.topCornerRadius`
  #      （逻辑 px）贯通到着色器 `u_corner_radius`，材料矩形两个**上角**按面板
  #      半径走弧、弧外一律不输出（含无模糊的输出路径）；补丁 4 只能堵矩形外，
  #      矩形内、圆弧外的那块（角外平铺的真身）由它堵。与主仓「模糊矩形下沉到
  #      面板上沿起画」配合，材料形状与面板轮廓严丝合缝。同提交撤掉全部分布图
  #      加载链路的临时诊断日志。
  # fork 自 inspirestack/inspire_blur，分支 mikcb/distribution-pixels-cache，
  # 基线 tag v0.4.1（a44d40c）；改补丁请改 C:/cursor/inspire_blur 那份克隆。
  # 全部理由与删除清单见 test/architecture/inspire_blur_patch_test.dart。
  # 2026-09-29：ref 指向含**五个**补丁的提交 ea18035（6247f02 = 补丁 1；75442c3 =
  # 补丁 1+2；60c211b = 再放出 toDistributionMap 扩展；7333834 = 再放出声明
  # intensityAt 的 IntensityBasedDistributionMap；0b84c9c = 补丁 3 显式设 u_size；
  # e850e72 = 补丁 4 材料矩形外输出透明；0d7614c = 临时诊断日志（已撤）；
  # ea18035 = 补丁 5 顶角圆弧遮罩接线；762d126 = 撤加载链路诊断探针，本 pin 所指）。
  inspire_blur:
    git:
      url: https://github.com/Mutx163/inspire_blur.git
      ref: 762d126ed3c55240d56cd8c0370e06938ee22a61

flutter:
  uses-material-design: true
  generate: true
  # 课程卡片「液态玻璃」档的着色器：在共享的预模糊壁纸上做圆角 SDF 边缘折射 +
  # 染色 + 边缘高光。一份纹理全部卡片共用，没有离屏与回读，见 shaders/ 里的注释。
  # 加载失败（或后端不支持）时卡片回落「高斯磨砂」外观，不会破相。
  shaders:
    - shaders/course_card_glass.frag
    # 全局「液态玻璃」表面（弹层 / 顶栏 / 玻璃坞…）的着色器：当 `ImageFilter`
    # 用（BackdropFilter 的滤镜输入即实时背景），折射数学与卡片那份同源。
    # 加载失败时各表面回落自己既有的基础材质，不会破相。
    - shaders/glass_surface_refraction.frag
  assets:
    - assets/branding/
    - assets/donate/
    - assets/holidays/
    - docs/releases/
    - assets/lan_edit/
    - assets/templates/
