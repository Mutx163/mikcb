name: university_timetable
description: 轻屿课表应用 - 支持小米超级岛
publish_to: 'none'
version: 2.0.5-5+117
repository: https://github.com/Mutx163/mikcb
homepage: https://github.com/Mutx163/mikcb
issue_tracker: https://github.com/Mutx163/mikcb/issues
license: GPL-3.0-or-later

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.2.1
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  http: ^1.2.2
  package_info_plus: ^8.0.2
  share_plus: ^12.0.2
  crypto: ^3.0.6
  webdav_plus: ^1.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_markdown: ^0.7.7+1
  flutter_secure_storage: ^10.3.1
  webview_flutter: 4.11.0
  azlistview: ^2.0.0
  animations: ^2.0.11
  table_parser: ^1.0.1
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  fast_gbk: ^1.0.0
  flutter_svg: ^2.3.0
  image: ^4.8.0
  flutter_miuix: ^1.0.9
  liquid_glass_renderer: ^0.2.0-dev.4
  flutter_blackbox: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

# 本地开发：字重跟随系统的改动尚未发布到 pub，先用本地克隆覆盖（.vendor 已 gitignore）。
# PR 合并/发版后可移除本段，回到 pub 上的 flutter_miuix。
dependency_overrides:
  flutter_miuix:
    path: .vendor/flutter_miuix

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/donate/
    - assets/holidays/
    - docs/releases/
    - assets/lan_edit/
    - assets/templates/
