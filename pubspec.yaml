name: university_timetable
description: 轻屿课表应用 - 支持小米超级岛
publish_to: 'none'
version: 1.2.0-2+61

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.2.1
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  http: ^1.2.2
  package_info_plus: ^8.0.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_markdown: ^0.7.7+1
  webview_flutter: 4.11.0
  azlistview: ^2.0.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/launcher_icon.png
    - assets/donate/wechatpay.png
    - assets/donate/alipay.png
