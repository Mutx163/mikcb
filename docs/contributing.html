<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.contributingTitle">轻屿课表 - 贡献指南</title>
    <meta
      name="description"
      content="轻屿课表贡献指南，帮助开发者快速了解源码、开源协议、Issue 反馈与教务适配参与方式。" data-i18n-attr="content:meta.contributingDescription"
    />
    <link rel="icon" href="./app-icon.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .policy-content h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 1rem;
      }
      .policy-content h2 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 1.5rem 0 0.75rem;
      }
      .policy-content p {
        margin: 0.75rem 0;
        line-height: 1.7;
      }
      .policy-content ul {
        margin: 0.5rem 0 1rem 1.25rem;
        line-height: 1.7;
      }
      .policy-content li {
        margin: 0.35rem 0;
      }
      .policy-content a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="detail-page">
      <section class="section-shell reveal">
        <p class="section-label" data-i18n="legal.openSourceLabel">开源参与</p>
        <h1 data-i18n="legal.contributingTitle">贡献指南</h1>
        <div class="policy-content" id="contributing-content">
          <p data-i18n="legal.loading">加载中…</p>
        </div>
        <div class="inline-links">
          <a href="./index.html" data-i18n="legal.backHome">返回首页</a>
          <a
            href="https://github.com/Mutx163/mikcb"
            target="_blank"
            rel="noreferrer"
            data-i18n="legal.openGithub"
          >
            打开 GitHub
          </a>
        </div>
      </section>
    </main>
    <script src="./i18n.js"></script>
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (async function () {
        const container = document.getElementById("contributing-content");
        try {
          const response = await fetch("./CONTRIBUTING.md", {
            cache: "no-store",
          });
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          const md = await response.text();
          if (typeof marked !== "undefined") {
            container.innerHTML = marked.parse(md);
          } else {
            container.innerHTML = "<p>" + (window.I18n ? window.I18n.t("legal.contribLoadFail") : "Markdown 渲染器加载失败，请直接查看 GitHub 上的贡献指南。") + "</p>";
          }
        } catch (e) {
          container.innerHTML =
            '<p>' + (window.I18n ? window.I18n.t("legal.contribFetchFailHtml") : '无法加载贡献指南内容，请前往 <a href="https://github.com/Mutx163/mikcb/blob/main/CONTRIBUTING.md" target="_blank" rel="noreferrer">GitHub 查看</a>。') + '</p>';
        }
      })();
    </script>
  </body>
</html>
